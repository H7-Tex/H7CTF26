name: Perp Guard
author: h7
category: blockchain
difficulty: insane
description: |
  perpguard is a solana lending market. post collateral, open positions, borrow. its safety
  model is simple: if a position goes underwater anyone can liquidate it and make the market
  whole, so every position must stay liquidatable.

  you're a borrower who plans to default. the oracle's about to mark your collateral down. end up
  underwater on a loan the keepers can never claw back. launch an instance and connect over the
  provided endpoint.
sub_description: "leave yourself underwater on a loan no keeper can ever liquidate."
points: 1000
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/program/src/lib.rs
  - path: challenge/program/Cargo.toml
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/perp_guard
  cpu_limit: "1"
  memory_limit: 1Gi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 1800
  max_extensions: 2
