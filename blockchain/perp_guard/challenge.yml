name: Perp Guard
author: h7
category: blockchain
difficulty: insane
description: |
  perpguard is a solana lending market. post collateral, open positions, borrow. if a position
  goes underwater anyone can liquidate it and make the market whole — that's the safety model,
  every position must stay liquidatable. obligations are capped so a keeper's loop can't run away.

  you're a borrower who plans to default. the oracle's about to mark your collateral down. take a
  loan the keepers can never claw back. launch an instance and connect over the provided endpoint.
sub_description: "a lending market where every position must stay liquidatable, and obligations are capped. break it anyway."
points: 1000
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/program/src/lib.rs
  - path: challenge/program/Cargo.toml
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/perp_guard
  cpu_limit: "1"
  memory_limit: 1Gi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 1800
  max_extensions: 2
