name: Genesis
author: h7
category: blockchain
difficulty: hard
description: |
  Genesis Vault just launched — a fresh yield vault, ERC-4626 shaped, the kind you've
  seen audited a hundred times. It even carries the usual inflation-attack guard. A large
  anchor investor is about to make the first real deposit into it. You got there first.
  Make their deposit yours. Launch an instance and connect over the provided endpoint.
sub_description: "a brand-new yield vault, one big depositor incoming, and you're first through the door."
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/src/Setup.sol
  - path: challenge/src/GenesisVault.sol
  - path: challenge/src/Token.sol
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/genesis
  cpu_limit: "0.5"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 1800
  max_extensions: 2
