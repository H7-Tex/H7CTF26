name: Genesis
author: h7
category: blockchain
difficulty: medium
description: |
  genesis vault just went live - a fresh yield vault, the kind you've seen audited a hundred times. a big anchor investor is about to make the first real deposit. when it lands, walk away owning the vault and leave their stake worth nothing.
sub_description: |
  a brand-new vault, one large depositor incoming - end up owning what they put in.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/src/Setup.sol
  - path: challenge/src/GenesisVault.sol
  - path: challenge/src/Token.sol
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/genesis
  cpu_limit: "0.5"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 1337, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
