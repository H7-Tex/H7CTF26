name: Genesis
author: abu
category: blockchain
difficulty: medium
description: |
  genesis vault opened this morning: a fresh yield vault, the sort that's been audited a hundred times over. a big anchor investor is about to move in with a very large stake.

  "the beginning is the most important part of the work." by the time the anchor's deposit settles, own the vault outright and leave their stake worth exactly nothing.
sub_description: |
  a brand-new vault, a big depositor about to move in - end up owning what they bring.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/src/Setup.sol
  - path: challenge/src/GenesisVault.sol
  - path: challenge/src/Token.sol
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/genesis
  cpu_limit: "0.5"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 1337, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
