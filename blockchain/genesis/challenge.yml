name: Genesis
author: h7
category: blockchain
difficulty: hard
description: |
  genesis vault just went live — fresh erc-4626, the kind you've seen audited a hundred times.
  a big anchor investor is about to make the first real deposit. you got there first.
  make their deposit yours. spin up an instance and connect over the provided endpoint.
sub_description: "fresh vault, one fat depositor incoming, and you're first through the door."
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/src/Setup.sol
  - path: challenge/src/GenesisVault.sol
  - path: challenge/src/Token.sol
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/genesis
  cpu_limit: "0.5"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 1337, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
