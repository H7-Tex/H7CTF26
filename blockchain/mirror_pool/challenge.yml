name: Trompe-l'œil
author: h7
category: blockchain
difficulty: insane
description: |
  MirrorLend lets you borrow against your Mirror LP tokens, and it holds a real reserve for its lenders. On paper the numbers add up.

  Borrow far more than your collateral is honestly worth and walk off with the lender's funds.
sub_description: |
  borrow against your LP collateral for far more than it's worth and drain the lender.
points: 1000
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/src/Setup.sol
  - path: challenge/src/Pool.sol
  - path: challenge/src/MirrorLend.sol
  - path: challenge/src/Token.sol
  - path: challenge/src/IERC20.sol
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/mirror_pool
  cpu_limit: "0.5"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 1337, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
