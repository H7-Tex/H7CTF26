name: Cross Collateral
author: h7
category: blockchain
difficulty: hard
description: |
  crosscollateral is a multi-asset bank on sui. deposit any listed asset, get a ticket, redeem it
  later for any other listed asset — converted at the bank's posted prices. it holds a real sui
  reserve for its honest users.

  you've got a bag of a worthless listed token. leave with the sui. spin up an instance and
  connect over the provided endpoint.
sub_description: "a priced multi-asset bank. trading junk up to sui should cost you. it doesn't."
points: 800
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/sources/bank.move
  - path: challenge/sources/cheap.move
  - path: challenge/Move.toml
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/cross_collateral
  cpu_limit: "1"
  memory_limit: 1Gi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 1800
  max_extensions: 2
