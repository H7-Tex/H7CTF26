name: Tidepool
slug: tidepool
author: abu
category: blockchain
difficulty: hard
description: |
  tidepool is a sui liquidity pool: mint liquidity, pay what it says you owe, and redeem your share of the reserve later. it looks locked down. the obvious ways in are all closed off.

  walk out with the whole reserve.
sub_description: |
  a sui liquidity pool that looks locked down. drain its entire reserve.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/sources/pool.move
  - path: challenge/Move.toml
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/off_by_2_192
  cpu_limit: "1"
  memory_limit: 1Gi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 1800
  max_extensions: 2
