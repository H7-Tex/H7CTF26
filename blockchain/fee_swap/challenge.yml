name: Fee Swap
author: h7
category: blockchain
difficulty: hard
description: |
  feeswap is a tiny two-asset pool. send it token A, get token B back — minus a small swap fee
  the pool skims for itself. clean 1:1 desk, healthy B reserve it's confident it can always cover.

  you're holding token A. walk out with the pool's B reserve. spin up an instance and connect
  over the provided endpoint.
sub_description: "a 1:1 swap desk that skims a fee to stay whole. drain its reserve anyway."
points: 800
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/program/src/lib.rs
  - path: challenge/program/Cargo.toml
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/fee_swap
  cpu_limit: "1"
  memory_limit: 1Gi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 1800
  max_extensions: 2
