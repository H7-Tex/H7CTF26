[package]
name = "perp-guard-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "perp-guard-server"
path = "src/main.rs"

[dependencies]
sol-ctf-framework = { git = "https://github.com/otter-sec/sol-ctf-framework", rev = "89c89f74edbb2f8c6dee3b9e6d12a90e0199b7d0" }
solana-sdk = "3.0"
solana-system-interface = { version = "3.0", features = ["bincode"] }
borsh = "1.5"
tokio = { version = "1", features = ["full"] }
perp_guard = { path = "../program", features = ["no-entrypoint"] }
