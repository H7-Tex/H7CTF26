name: Tidepool
author: h7
category: blockchain
difficulty: insane
description: |
  tidepool is a sui liquidity pool. mint liquidity, pay what it says you owe, redeem your share
  later. the payout math runs through a checked fixed-point conversion, there's a cap on how much
  you can mint at once, and it won't hand out liquidity for free. looks locked down.

  walk out with the whole reserve. spin up an instance and connect over the provided endpoint.
sub_description: "a sui pool with a cap, an overflow check, and a no-free-liquidity guard. all three hold. drain it anyway."
points: 1000
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/sources/pool.move
  - path: challenge/Move.toml
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/off_by_2_192
  cpu_limit: "1"
  memory_limit: 1Gi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 1800
  max_extensions: 2
