name: Tidepool
author: h7
category: blockchain
difficulty: insane
description: |
  Tidepool is a Sui liquidity pool. To mint liquidity you pay for it, and the amount you owe is
  computed with a checked fixed-point conversion that refuses to proceed on overflow. The math
  looks careful.

  Mint yourself the pool's whole reserve for nothing. Launch an instance and connect over the
  provided endpoint.
sub_description: "a sui pool that prices your deposits through a checked fixed-point conversion. the math looks careful."
points: 1000
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
provide:
  - path: challenge/sources/pool.move
  - path: challenge/Move.toml
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/off_by_2_192
  cpu_limit: "1"
  memory_limit: 1Gi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 1800
  max_extensions: 2
