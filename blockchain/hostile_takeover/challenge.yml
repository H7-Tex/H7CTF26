name: Hostile Takeover
author: abu
category: blockchain
difficulty: insane
description: |
  GENESIS DAO owns a treasury, and one privileged seat controls it: the Guardian. This is King of the Hill on-chain - seize the Guardian seat, install your team, and hold it while rivals fight to take it back.

  The seat resets each round, so expect to take it more than once.
sub_description: |
  On-chain King of the Hill: seize the DAO Guardian seat and hold it to score - it resets each round, so re-solve to re-hold.
scoring: koth
koth:
  status_path: /koth/status
  tick_seconds: 15
  points_per_tick: 10
provide:
  - path: challenge/src/GovToken.sol
  - path: challenge/src/FlashLender.sol
  - path: challenge/src/Governor.sol
  - path: challenge/src/Throne.sol
  - path: challenge/src/Setup.sol
deploy:
  resource_type: docker
  instancing: static
  image: h7ctf26/hostile-takeover
  cpu_limit: "2.0"
  memory_limit: 1Gi
  exposed_ports:
    - { port: 8080, protocol: http }
tags: [blockchain, smart-contract]
