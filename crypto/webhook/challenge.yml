name: Off the Hook
author: abu
category: crypto
difficulty: medium
description: |
  OrionPay delivers signed payment webhooks to your merchant endpoint, and your
  endpoint trusts any webhook whose signature checks out. A webhook that sets
  `role=owner` authorizes an owner-only payout. You captured one legitimate webhook,
  but you were never given the signing secret.

  Launch your instance. The receiver speaks over HTTP at your instance's base URL (shown when you launch it):

      GET  /sample        -> a captured legitimate webhook (body + X-Signature)
      POST /webhook       -> processed if the signature verifies; role=owner pays out
      POST /v2/webhook    -> a hardened next-gen endpoint

  Authorize an owner payout you were never handed a signature for.
sub_description: |
  With one captured webhook and no signing secret, get the receiver to authorize an
  owner-only payout.
points: 300
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/webhook
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
