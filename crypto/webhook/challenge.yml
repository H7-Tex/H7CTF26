name: Owner's Draw
author: abu
category: crypto
difficulty: medium
description: |
  OrionPay does exactly what it's told, provided the paperwork looks right. The owner's draw is the one payout nobody else is supposed to touch. You walked away with a single genuine slip and a lot of curiosity.

  The rest is between you and the accountant.
sub_description: |
  One payout is reserved for the owner. You have a single genuine slip and a lot of nerve.
points: 300
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/webhook
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
