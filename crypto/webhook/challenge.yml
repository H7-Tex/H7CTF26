name: Owner's Draw
author: abu
category: crypto
difficulty: medium
description: |
  OrionPay delivers signed payment webhooks to your merchant endpoint, which trusts any webhook whose signature checks out. A webhook that sets role=owner authorizes an owner-only payout. You captured one legitimate webhook, but you were never given the signing secret. A hardened next-gen endpoint runs beside the original.

  Authorize an owner payout you were never handed a signature for.
sub_description: |
  With one captured webhook and no signing secret, get the receiver to authorize an owner-only payout.
points: 300
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/webhook
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
