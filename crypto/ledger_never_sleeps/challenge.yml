name: The Ledger Never Sleeps
author: abu
category: crypto
difficulty: insane
description: |
  The Aurum treasury signer is online. Send it an approval and it signs, but it always refuses an admin transfer. To shave a step off every signature, a former engineer reworked the signing routine, and the audit never noticed.

  Recover the signing key from the approvals it issues, then authorize the transfer it would never sign.
sub_description: |
  Recover the treasury signer's key from the approvals it issues, then authorize the admin transfer it refuses to sign.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/ledger-never-sleeps
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
