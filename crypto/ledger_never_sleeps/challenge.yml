name: The Ledger Never Sleeps
author: abu
category: crypto
difficulty: hard
description: |
  The Aurum treasury signer is online. Send it an approval and it signs, with one
  exception: an ADMIN_TRANSFER, which it always refuses. A former engineer reworked
  the signing routine to shave a step off every signature, and the audit waved it
  through because nothing in the output ever looked out of place.

  Launch your instance. The signer speaks JSON over HTTP at your instance's base URL (shown when you launch it):

      GET  /pubkey            -> the signer public key
      POST /sign  {msg}       -> a signed approval (ADMIN_TRANSFER refused)
      POST /forge {msg,r,s}   -> submit a signature; a valid ADMIN_TRANSFER releases the flag

  Recover the signing key from the approvals it hands you, then authorize the
  transfer it would never sign.
sub_description: |
  Recover the treasury signer's private key from the approvals it issues, then
  authorize the admin transfer it refuses to sign.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/ledger-never-sleeps
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
