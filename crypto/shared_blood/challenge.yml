name: Shared Blood
author: abu
category: crypto
difficulty: medium
description: |
  VoltEye runs a fleet of IP cameras. Every device ships with its own public-key
  identity cert, and during provisioning the cloud encrypts an admin bootstrap token
  to each device using that device's public key. You have pulled the whole fleet's
  public certs and intercepted a single provisioning payload addressed to one
  device; the admin bootstrap token sealed inside it unlocks the console.

  Launch your instance. The camera cloud is at your instance's base URL (shown
  when you launch it):

      GET  /fleet             device certs (public keys)
      GET  /captured          one intercepted provisioning payload
      POST /admin {token}     admin bootstrap; the right token unlocks the flag

  Recover the target device's private key, read the token it protects, and unlock the console.
sub_description: |
  From the camera fleet's public certs and one intercepted payload, recover the
  target device's key and read the admin token that unlocks the console.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/shared-blood
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
