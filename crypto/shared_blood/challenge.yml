name: Shared Blood
author: abu
category: crypto
difficulty: medium
description: |
  VoltEye runs a fleet of IP cameras. Each device ships with its own identity certificate, and during provisioning the cloud seals an admin token to each one. You pulled the whole fleet's certificates and intercepted a single provisioning payload addressed to one device; the token sealed inside unlocks its console.

  Recover that device's key, read the token it protects, and unlock the console.
sub_description: |
  From the camera fleet's certificates and one intercepted payload, recover the target device's key and read the admin token that unlocks the console.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/shared-blood
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
