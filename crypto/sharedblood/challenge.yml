name: Shared Blood
author: abu
category: crypto
difficulty: medium
description: |
  VoltEye ships a whole fleet of identical cameras, cranked out on the same assembly line, in the same hurry. Somewhere in that crowd is one device whose console you'd very much like to open.

  Family resemblance runs deeper than you'd think.
sub_description: |
  A fleet of near-identical cameras, all built in the same hurry. One console you want open. Family resemblance runs deep.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/shared-blood
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
