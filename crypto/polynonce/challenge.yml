name: Polynonce
author: abu
category: crypto
difficulty: hard
description: |
  Aurum's treasury signer rubber-stamps transfers by the batch, day in and day out. The engineer who wired it up cut a corner to keep the queue moving, then quietly left the company.

  The corner he cut is still signing every approval.
sub_description: |
  A stack of the signer's approvals is all you get. It is all you need.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/polynonce
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [crypto]
