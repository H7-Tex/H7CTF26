name: Polynonce
author: abu
category: crypto
difficulty: hard
description: |
  The Aurum treasury signer batches approvals. To save time, a former engineer stopped drawing each signature's nonce at random.

  Recover the signing key.
sub_description: |
  Recover the signing key from a batch of the treasury signer's approvals and use it to open the sealed flag.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/polynonce
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [crypto]
