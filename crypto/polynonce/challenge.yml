name: Polynonce
author: abu
category: crypto
difficulty: hard
description: |
  The Aurum treasury runs an automated signer that batches payout approvals. To
  "shave a step off every signature", a since-departed engineer rewrote part of
  the signing routine, and the internal audit signed off — the outputs looked
  clean and nothing ever repeated. The signer's public key and a batch of its
  approvals have leaked, along with a sealed file holding the treasury's secret.

  Launch your instance and download the two files it serves at your instance's
  base URL (shown when you launch it): `signatures.json` (the public key and eight
  signed approvals) and `flag.enc`. You can solve offline once you have them.
  Recover the signer's private key from the batch of approvals, then use it to open
  the sealed file:

      key = SHA256(d)             # d = private key, 32-byte big-endian
      iv  = SHA256("Qx,Qy")[:12]  # decimal pubkey coords, comma-joined
      flag.enc = AES-256-GCM(key, iv, FLAG)   # ciphertext || 16-byte tag

  Recover the key. Open the envelope.
sub_description: |
  Recover the treasury signer's private key from a batch of its approvals and use
  it to open the sealed flag.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/polynonce
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [crypto]
