name: Take Two
author: abu
category: crypto
difficulty: hard
description: |
  Helios ships signed firmware. The device boots any build that carries a valid signature, and the notary signs only builds it trusts.

  Boot a build the notary would never sign.
sub_description: |
  Boot a backdoored firmware build the notary would never sign.
points: 500
provide:
  - path: challenge/lms.py
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/rollback
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
