name: Rollback
author: abu
category: crypto
difficulty: hard
description: |
  Helios ships firmware signed by a notary, and each device boots any build that
  verifies against its burned-in trust anchor. The notary will happily notarize
  benign builds but flatly refuses to sign a backdoored one. It also exposes a
  maintenance operation for its operators.

  Get the device to boot a backdoored build. Launch your instance; the notary
  speaks JSON over HTTP at your instance's base URL (shown when you launch it):

      GET  /root                    -> the device trust anchor
      POST /sign {firmware}         -> notarize a benign build (backdoored builds refused)
      POST /rollback                -> operator maintenance
      POST /deploy {firmware, sig}  -> device update; boots anything that verifies

  The signing scheme is implemented in `lms.py` (attached).
sub_description: |
  Get the device to boot a backdoored firmware build that the notary refuses to sign.
points: 500
provide:
  - path: challenge/lms.py
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/rollback
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
