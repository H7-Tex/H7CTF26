name: Take Two
author: abu
category: crypto
difficulty: hard
description: |
  Helios firmware boots only with the notary's blessing, and the notary blesses only the builds it trusts. The one you have in mind will never make that list.

  Lucky for you, it is not above a second take.
sub_description: |
  Boot a build the notary would never put its name on.
points: 500
provide:
  - path: challenge/lms.py
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/rollback
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
