name: Loose Lips
author: abu
category: crypto
difficulty: hard
description: |
  DecryptoStat crunches the numbers without ever peeking at your data, or so the pitch deck promises. The original service still hums along beside the hardened rewrite that was meant to make it behave.

  Both of them are hopeless at keeping a secret.
sub_description: |
  Two versions, two keys neither was ever meant to let slip.
points: 600
provide:
  - path: challenge/ckks.py
flags:
  - type: dynamic
    name: v1
    dynamic_flag_prefix: "H7CTF{"
    points: 40
  - type: dynamic
    name: v2
    dynamic_flag_prefix: "H7CTF{"
    points: 60
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/decryptostat
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
