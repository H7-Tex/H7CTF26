name: Loose Lips
author: abu
category: crypto
difficulty: hard
description: |
  DecryptoStat runs analytics on encrypted data. A legacy service runs beside a hardened successor.

  Recover the secret key behind each.
sub_description: |
  Recover the secret key behind each version of the encrypted-analytics service.
points: 600
provide:
  - path: challenge/ckks.py
flags:
  - type: dynamic
    name: v1
    dynamic_flag_prefix: "H7CTF{"
    points: 250
  - type: dynamic
    name: v2
    dynamic_flag_prefix: "H7CTF{"
    points: 350
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/decryptostat
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
