name: DecryptoStat
author: abu
category: crypto
difficulty: hard
description: |
  DecryptoStat runs analytics on encrypted data using CKKS approximate homomorphic
  encryption. It decrypts the ciphertexts it issued and returns the result. `v1` is
  the legacy service; `v2` hardens decryption with noise flooding. Both leak the
  secret key.

  Launch your instance. The service speaks JSON over HTTP at your instance's base
  URL (shown when you launch it):

      POST /v1/encrypt {values}   POST /v1/decrypt {id}   POST /v1/recover {s}   (flag 1)
      POST /v2/encrypt {values}   POST /v2/decrypt {id}   POST /v2/recover {s}   (flag 2)

  Recover each secret key and submit it. The scheme is in `ckks.py` (attached); the
  weakness is not in that code.
sub_description: |
  An encrypted-analytics service that answers just a little too precisely. Noise
  flooding does not save it.
points: 600
provide:
  - path: challenge/ckks.py
flags:
  - type: dynamic
    name: v1
    dynamic_flag_prefix: "H7CTF{"
    points: 250
  - type: dynamic
    name: v2
    dynamic_flag_prefix: "H7CTF{"
    points: 350
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/decryptostat
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto, fhe, ckks, lattice, ind-cpad]
