name: DecryptoStat
author: abu
category: crypto
difficulty: hard
description: |
  DecryptoStat runs analytics over encrypted data: you can have it encrypt a vector
  and later have it decrypt a ciphertext it previously issued, and it returns the
  result. `v1` is the legacy service; `v2` is a hardened rebuild meant to close v1's
  gap. Your job is to walk out with each version's secret key.

  Launch your instance. The service speaks JSON over HTTP at your instance's base
  URL (shown when you launch it):

      POST /v1/encrypt {values}   POST /v1/decrypt {id}   POST /v1/recover {s}   (flag 1)
      POST /v2/encrypt {values}   POST /v2/decrypt {id}   POST /v2/recover {s}   (flag 2)

  Recover each secret key and submit it to the matching `/recover`. The scheme is
  implemented in `ckks.py` (attached).
sub_description: |
  Recover the secret key behind each version of the encrypted-analytics service and
  submit it.
points: 600
provide:
  - path: challenge/ckks.py
flags:
  - type: dynamic
    name: v1
    dynamic_flag_prefix: "H7CTF{"
    points: 250
  - type: dynamic
    name: v2
    dynamic_flag_prefix: "H7CTF{"
    points: 350
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/decryptostat
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [crypto]
