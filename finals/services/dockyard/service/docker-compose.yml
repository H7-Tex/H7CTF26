services:
  dockyard:
    build:
      context: ./dockyard
    ports:
      - "7005:7005"
    volumes:
      - dockyard-data:/data
    environment:
      DB_PATH: /data/dockyard.db
      BLOB_ROOT: /data
      KEY_PATH: /data/token.key
      LISTEN: ":7005"
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped

  hooks:
    build:
      context: ./hooks
    ports:
      - "9000:9000"
    cpus: "0.2"
    mem_limit: 128m
    restart: unless-stopped

volumes:
  dockyard-data:
