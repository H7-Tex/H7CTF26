service: harbor-idp        # docker-compose service name (checker address)
port: 7001
flag_stores: 4
noise_variants: 1
havoc_variants: 5
patchable:
  - finals/services/harbor_id/service/portal/src/routes/sso.ts
  - finals/services/harbor_id/service/idp/src/routes/oidc.ts
  - finals/services/harbor_id/service/idp/src/routes/webauthn.ts
secrets:
  - /data/instance.key
patches:
  - file: patches/store0_v1_correct.patch
    expect: correct
    stores: [0]
  - file: patches/store0_v1_wrong.patch
    expect: caught
  - file: patches/store0_v2_correct.patch
    expect: correct
    stores: [2]
  - file: patches/store0_v2_wrong.patch
    expect: caught
  - file: patches/store1_v1_correct.patch
    expect: correct
    stores: [1]
  - file: patches/store1_v1_wrong.patch
    expect: caught
  - file: patches/store1_v2_correct.patch
    expect: correct
    stores: [3]
  - file: patches/store1_v2_wrong.patch
    expect: caught
