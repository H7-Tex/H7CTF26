services:
  harbor-idp:
    build: ./idp
    ports:
      - "7001:7001"
    volumes:
      - idp-data:/data
    restart: unless-stopped
    cpus: 0.6
    mem_limit: 400m
    environment:
      DATA_DIR: /data
      PORT: "7001"
      IDP_ISSUER: "http://harbor-idp:7001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:7001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  harbor-portal:
    build: ./portal
    ports:
      - "7011:7011"
    volumes:
      - portal-data:/data
    restart: unless-stopped
    cpus: 0.4
    mem_limit: 300m
    depends_on:
      harbor-idp:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      PORT: "7011"
      IDP_URL: "http://harbor-idp:7001"
      IDP_ISSUER: "http://harbor-idp:7001"

volumes:
  idp-data:
  portal-data:
