# local full-stack rehearsal for H7CTF'26 finals.
# one flat network, 172.30.0.0/24; fixed IPs so the checker can reach notebooks by IP.
# build anvil from ANVIL_SRC (default: ../../../../Anvil-P2-Runner relative to this file).
# usage: ANVIL_SRC=/path/to/Anvil docker compose up --build -d
#
# team IPs:  172.30.0.11-15 (team1-5)
# NOP IP:    172.30.0.20
# team4 runs the patched notebook image (store0_correct.patch applied).

x-anvil-common: &anvil-common
  build:
    context: ${ANVIL_SRC:-../../../../Anvil-P2-Runner}
    dockerfile: deployments/docker/Dockerfile.api
  environment: &anvil-env
    ANVIL_ENVIRONMENT: development
    ANVIL_DATABASE_HOST: postgres
    ANVIL_DATABASE_PORT: "5432"
    ANVIL_DATABASE_USER: anvil
    ANVIL_DATABASE_PASSWORD: anvil
    ANVIL_DATABASE_DATABASE: anvil
    ANVIL_DATABASE_SSL_MODE: disable
    ANVIL_JWT_SECRET: rehearsal-jwt-secret-at-least-32-chars
    ANVIL_GAME_ENABLED: "true"
    ANVIL_GAME_TICK_INTERVAL: 30s
    ANVIL_GAME_CHECKER_TASK_TIMEOUT: 7s
    ANVIL_GAME_OUTBREAK_ENABLED: "true"
    ANVIL_GAME_TCP_SUBMIT_ENABLED: "true"
    ANVIL_GAME_TCP_SUBMIT_PORT: "4141"
    ANVIL_GAME_FLAG_PREFIX: H7CTF
    ANVIL_GAME_FLAG_VALID_TICKS: "10"
    ANVIL_GAME_INTERNAL_TOKEN: rehearsal-internal-token
    ANVIL_GAME_SCORING_FORMULA: mirror
    ANVIL_GAME_SCORING_N_TEAMS: "5"
    ANVIL_GAME_SCORING_FREE_DEPLOYS: "3"
    ANVIL_GAME_SCORING_MASS_FAULT_TEAMS: "3"
    ANVIL_PLATFORM_REGISTRATION_MODE: open
    ANVIL_PLATFORM_SCORING_ENABLED: "true"
    ANVIL_PLATFORM_SCOREBOARD_ENABLED: "true"
    ANVIL_PLATFORM_SCOREBOARD_PUBLIC: "true"
    ANVIL_RATE_LIMIT_ENABLED: "false"
    ANVIL_VPN_ENABLED: "false"
    GOTMPDIR: /tmp/gotmp
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anvil
      POSTGRES_PASSWORD: anvil
      POSTGRES_DB: anvil
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "anvil"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      rehearsal:
        ipv4_address: 172.30.0.2
    volumes:
      - pg-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    networks:
      rehearsal:
        ipv4_address: 172.30.0.3
    volumes:
      - mongo-data:/data/db

  anvil-api:
    <<: *anvil-common
    environment:
      <<: *anvil-env
      ANVIL_GAME_CONTROLLER_ENABLED: "false"
    ports:
      - "8080:8080"
    networks:
      rehearsal:
        ipv4_address: 172.30.0.4
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  anvil-gameserver:
    <<: *anvil-common
    environment:
      <<: *anvil-env
      ANVIL_GAME_CONTROLLER_ENABLED: "true"
    ports:
      - "8081:8080"
      - "4141:4141"
    networks:
      rehearsal:
        ipv4_address: 172.30.0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  checker-notebook:
    build:
      context: ../../_template/checker
    environment:
      MONGO_HOST: 172.30.0.3
      MONGO_PORT: "27017"
    depends_on:
      - mongo
    networks:
      rehearsal:
        ipv4_address: 172.30.0.6

  notebook-team1:
    build:
      context: ../../_template/service/notebook
    volumes: [nb-t1:/data]
    networks:
      rehearsal:
        ipv4_address: 172.30.0.11

  notebook-team2:
    build:
      context: ../../_template/service/notebook
    volumes: [nb-t2:/data]
    networks:
      rehearsal:
        ipv4_address: 172.30.0.12

  notebook-team3:
    build:
      context: ../../_template/service/notebook
    volumes: [nb-t3:/data]
    networks:
      rehearsal:
        ipv4_address: 172.30.0.13

  notebook-team4:
    build:
      context: .
      dockerfile: Dockerfile.notebook-patched
    volumes: [nb-t4:/data]
    networks:
      rehearsal:
        ipv4_address: 172.30.0.14

  notebook-team5:
    build:
      context: ../../_template/service/notebook
    volumes: [nb-t5:/data]
    networks:
      rehearsal:
        ipv4_address: 172.30.0.15

  notebook-nop:
    build:
      context: ../../_template/service/notebook
    volumes: [nb-nop:/data]
    networks:
      rehearsal:
        ipv4_address: 172.30.0.20

networks:
  rehearsal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pg-data:
  mongo-data:
  nb-t1:
  nb-t2:
  nb-t3:
  nb-t4:
  nb-t5:
  nb-nop:
