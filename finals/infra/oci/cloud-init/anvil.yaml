#cloud-config
# Anvil VM: finals.h7tex.com, Postgres, Anvil binary
# owned by Finals-3 (engine WP); cloud-init only provisions the base OS + Docker
packages:
  - docker.io
  - docker-compose-v2
  - postgresql-client
  - certbot
  - python3-certbot-nginx
  - nginx
  - chrony

write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "registry-mirrors": ["http://10.60.202.10:5001"],
        "insecure-registries": ["10.60.202.10:5001"]
      }
  - path: /etc/nginx/sites-available/anvil
    content: |
      server {
        listen 80;
        server_name finals.h7tex.com;
        location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; }
      }
  - path: /etc/chrony/sources.d/oci.sources
    content: |
      server 169.254.169.123 iburst prefer

runcmd:
  - systemctl enable --now chrony docker nginx
  - ln -sf /etc/nginx/sites-available/anvil /etc/nginx/sites-enabled/anvil
  - rm -f /etc/nginx/sites-enabled/default
  - mkdir -p /srv/anvil
