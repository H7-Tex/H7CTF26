#cloud-config
# checker runner VM: runs tick scripts + deploy-gate API
# owned by Finals-3 (engine WP); this cloud-init only provisions the OS
packages:
  - docker.io
  - docker-compose-v2
  - python3
  - python3-pip
  - redis
  - chrony

write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "registry-mirrors": ["http://10.60.202.10:5001"],
        "insecure-registries": ["10.60.202.10:5001"]
      }
  - path: /etc/chrony/sources.d/oci.sources
    content: |
      server 169.254.169.123 iburst prefer

runcmd:
  - systemctl enable --now chrony docker redis-server
  - pip3 install -q flask requests httpx
  # gate API placeholder; Finals-3 deploys the actual checker service
  - |
    cat > /etc/systemd/system/checker-gate.service <<'SVC'
    [Unit]
    Description=checker gate API
    After=docker.service
    [Service]
    WorkingDirectory=/srv/checker
    ExecStartPre=-/usr/bin/docker-compose pull
    ExecStart=/usr/bin/docker-compose up
    Restart=on-failure
    [Install]
    WantedBy=multi-user.target
    SVC
  - mkdir -p /srv/checker
  - systemctl daemon-reload
