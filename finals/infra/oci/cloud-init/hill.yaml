#cloud-config
# KotH hill VM (GridWatch II or Hostile Takeover II)
# image and service specific content deployed by Finals-3; this just provisions Docker + chrony
packages:
  - docker.io
  - docker-compose-v2
  - python3
  - python3-pip
  - chrony

write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "registry-mirrors": ["http://10.60.202.10:5001"],
        "insecure-registries": ["10.60.202.10:5001"],
        "log-driver": "json-file",
        "log-opts": {"max-size": "50m", "max-file": "3"}
      }
  - path: /etc/chrony/sources.d/oci.sources
    content: |
      server 169.254.169.123 iburst prefer

runcmd:
  - systemctl enable --now chrony docker
  - mkdir -p /srv/koth
