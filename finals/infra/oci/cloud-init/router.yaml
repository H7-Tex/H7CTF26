#cloud-config
# router VM (r1 and r2): installs WireGuard, wstunnel, nftables, tcpdump; does NOT configure keys.
# key injection and nft ruleset happen via ops/dist-creds.sh after cloud-init completes.
package_update: true
package_upgrade: false
packages:
  - wireguard
  - wireguard-tools
  - nftables
  - tcpdump
  - nginx
  - qrencode
  - chrony
  - jq

write_files:
  - path: /etc/sysctl.d/99-router.conf
    content: |
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.forwarding = 1
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.all.rp_filter = 0
      net.core.rmem_max = 26214400
      net.core.wmem_max = 26214400
  - path: /etc/nftables.d/.keep
    content: ""
  - path: /etc/nginx/sites-available/pcap
    content: |
      server {
        listen 8081;
        root /srv/pcap;
        autoindex on;
        auth_basic "h7ctf pcap";
        auth_basic_user_file /etc/nginx/.pcap-htpasswd;
        location / { autoindex on; }
      }
  - path: /etc/chrony/sources.d/oci.sources
    content: |
      server 169.254.169.123 iburst prefer

runcmd:
  - sysctl --system
  - mkdir -p /srv/pcap /etc/wireguard
  - chmod 700 /etc/wireguard
  - ln -sf /etc/nginx/sites-available/pcap /etc/nginx/sites-enabled/pcap
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl enable --now nftables nginx chrony
  # wstunnel: TCP 443 -> WireGuard 51820 fallback for captive portals
  - |
    arch=$(uname -m)
    [[ $arch == x86_64 ]] && arch=amd64
    curl -fsSL "http://10.60.202.10/files/wstunnel-linux-$arch" -o /usr/local/bin/wstunnel && \
    chmod +x /usr/local/bin/wstunnel || true
  - |
    cat > /etc/systemd/system/wstunnel.service <<'SVC'
    [Unit]
    Description=wstunnel TCP:443->WireGuard
    After=network.target
    [Service]
    ExecStart=/usr/local/bin/wstunnel server wss://0.0.0.0:443 --restrict-to 127.0.0.1:51820
    Restart=on-failure
    [Install]
    WantedBy=multi-user.target
    SVC
  - systemctl daemon-reload; systemctl enable wstunnel || true
