#cloud-config
# ops VM: automation hub, reset API, creds distributor, staff access
packages:
  - python3
  - python3-pip
  - python3-venv
  - jq
  - sshpass
  - parallel
  - curl
  - git
  - chrony

write_files:
  - path: /etc/chrony/sources.d/oci.sources
    content: |
      server 169.254.169.123 iburst prefer
  - path: /srv/ops/requirements.txt
    content: |
      flask==3.0.3
      requests==2.32.3
      oci-sdk==2.130.0

runcmd:
  - systemctl enable --now chrony
  - mkdir -p /srv/ops /srv/logs
  - python3 -m venv /srv/ops/venv
  - /srv/ops/venv/bin/pip install -q -r /srv/ops/requirements.txt
  # reset API deployed by ops/reset-api.py (copied via dist-creds.sh)
  - |
    cat > /etc/systemd/system/reset-api.service <<'SVC'
    [Unit]
    Description=H7CTF finals reset API
    After=network.target
    [Service]
    WorkingDirectory=/srv/ops
    ExecStart=/srv/ops/venv/bin/python3 /srv/ops/reset-api.py
    Restart=on-failure
    EnvironmentFile=/srv/ops/reset-api.env
    [Install]
    WantedBy=multi-user.target
    SVC
  - systemctl daemon-reload
  # instance_principal OCI CLI bootstrap
  - pip3 install -q oci-cli
