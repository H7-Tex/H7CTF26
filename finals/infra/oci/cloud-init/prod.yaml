#cloud-config
# prod vulnbox: no team SSH (unless fallback A is activated).
# deployer + capped BuildKit run here; cloud-init bootstraps the deployer user and Docker.
# Golden image h7f-prod bakes most of this in; this file just seeds per-instance config.
package_update: false
packages: []

write_files:
  - path: /etc/sysctl.d/99-prod.conf
    content: |
      net.ipv4.ip_forward = 0
      vm.swappiness = 10
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {"max-size": "50m", "max-file": "3"},
        "registry-mirrors": ["http://10.60.202.10:5001"],
        "insecure-registries": ["10.60.202.10:5001"],
        "data-root": "/var/lib/docker",
        "max-concurrent-uploads": 2,
        "max-concurrent-downloads": 2
      }
  - path: /srv/deployer/config.env
    content: |
      MIRROR=http://10.60.202.10
      REGISTRY=10.60.202.10:5001
      CHECKER_GATE=http://10.60.201.20:8000
      GITEA_URL=http://10.60.201.30:3000
      BUILDKIT_MAX_PARALLELISM=2
  - path: /etc/chrony/sources.d/oci.sources
    content: |
      server 169.254.169.123 iburst prefer

runcmd:
  - sysctl --system
  - systemctl enable --now docker chrony
  - mkdir -p /srv/deployer /srv/staging /srv/prod /var/log/deployer
  # swapfile: 2 GB cushion for peak build load
  - |
    [[ -f /swapfile ]] || {
      fallocate -l 2G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      echo '/swapfile none swap sw 0 0' >> /etc/fstab
    }
  # DOCKER-USER chain: block IMDS from containers (169.254.169.254)
  - |
    iptables -N DOCKER-USER 2>/dev/null || true
    iptables -I DOCKER-USER -d 169.254.169.254 -j DROP
    iptables -I DOCKER-USER -d 169.254.0.0/16 -j DROP
