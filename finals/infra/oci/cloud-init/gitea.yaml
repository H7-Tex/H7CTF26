#cloud-config
# Gitea VM: team repo server (HTTP :3000, SSH :2222)
# data volume /dev/sdb mounted at /srv/gitea by mount-data.sh
packages:
  - docker.io
  - docker-compose-v2
  - git
  - chrony

write_files:
  - path: /srv/gitea/docker-compose.yml
    content: |
      services:
        gitea:
          image: 10.60.202.10:5001/gitea/gitea:1.22-rootless
          container_name: gitea
          restart: unless-stopped
          ports:
            - "10.60.201.30:3000:3000"
            - "10.60.201.30:2222:2222"
          volumes:
            - /srv/gitea/data:/var/lib/gitea
            - /srv/gitea/config:/etc/gitea
          environment:
            - USER_UID=1000
            - USER_GID=1000
            - GITEA__database__DB_TYPE=sqlite3
            - GITEA__database__PATH=/var/lib/gitea/data/gitea.db
            - GITEA__server__DOMAIN=gitea.internal.h7ctf
            - GITEA__server__SSH_DOMAIN=10.60.201.30
            - GITEA__server__SSH_PORT=2222
            - GITEA__server__OFFLINE_MODE=true
            - GITEA__security__INSTALL_LOCK=true
            - GITEA__service__DISABLE_REGISTRATION=true
  - path: /etc/chrony/sources.d/oci.sources
    content: |
      server 169.254.169.123 iburst prefer

runcmd:
  - systemctl enable --now chrony docker
  - mkdir -p /srv/gitea/{data,config}
  # gitea started by 70-gitea-seed.sh after admin token is created
