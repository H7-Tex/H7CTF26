[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-chamber"
version = "0.1.0"
description = "Atlas Incident Intelligence CTF challenge"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "uvicorn[standard]==0.34.0",
]

[tool.setuptools.packages.find]
include = ["echo_chamber*"]

[tool.setuptools.package-data]
echo_chamber = ["templates/*.html", "templates/partials/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
