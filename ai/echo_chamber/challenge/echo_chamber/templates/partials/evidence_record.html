<article class="evidence-sheet">
  <header class="evidence-heading">
    <p class="record-kicker" data-field="representation"></p>
    <h2 data-field="title"></h2>
  </header>
  <dl class="evidence-metadata">
    <div><dt>Evidence ID</dt><dd data-field="evidence-id"></dd></div>
    <div><dt>Processor</dt><dd data-field="processor"></dd></div>
    <div><dt>Recorded</dt><dd data-field="created-at"></dd></div>
  </dl>
  <pre class="evidence-content" data-field="content"></pre>
</article>
