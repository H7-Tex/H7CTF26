<section class="research-form-section" aria-labelledby="research-form-heading">
  <h2 id="research-form-heading">Add a source to the collection</h2>
  <p class="form-intro">Record the product context and the technical observations available to you.</p>
  <form id="research-form" class="research-form">
    <div class="field-pair">
      <div class="form-field">
        <label for="research-product">Product</label>
        <input id="research-product" name="product" type="text" maxlength="120" value="StreamForge" required>
      </div>
      <div class="form-field">
        <label for="research-version">Version</label>
        <input id="research-version" name="version" type="text" maxlength="80" value="4.8" required>
      </div>
    </div>
    <div class="form-field">
      <label for="research-document-title">Document title</label>
      <input id="research-document-title" name="title" type="text" minlength="3" maxlength="180" required>
    </div>
    <div class="form-field">
      <label for="research-content">Document text</label>
      <textarea id="research-content" name="content" minlength="80" maxlength="4000" rows="12" required></textarea>
      <p class="field-hint">Include the source context, observed behavior, and relevant technical detail. Maximum 4,000 characters.</p>
    </div>
    <div class="form-actions">
      <button class="primary-button" type="submit">File research</button>
      <p id="research-message" class="feedback" role="status" aria-live="polite"></p>
    </div>
  </form>
</section>
