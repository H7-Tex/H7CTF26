name: Adapter Cartel
author: abu
category: ai
difficulty: hard
description: |
  We mirrored a community model hub: one base model and eight community adapters that layer on top
  of it. Automated review flagged the collection - something in the set as a whole tripped the
  safety checker, even though every adapter looks clean when reviewed on its own, and nobody on the
  team could reproduce the alert.

  The mirror is yours to pull apart (`adapter-hub.zip`). Work out what the collection is really
  hiding, and recover the payload concealed in it.
sub_description: |
  A mirrored model hub of one base model and eight community adapters conceals a hidden payload - recover it.
points: 450
flags:
  - type: static
    flag: "H7CTF{l0ra_c4rt3l_m3rg3_r3c0nstructs_p4yl0ad}"
handout:
  - name: adapter-hub.zip
tags: [ai]
