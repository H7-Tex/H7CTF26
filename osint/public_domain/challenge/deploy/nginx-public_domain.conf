# Public Domain (OSINT) -- 4 static vhosts on atom, behind the existing cloudflared tunnel.
# Cloudflare terminates TLS at the edge (Universal SSL on the proxied hostnames); origin is plain :80.

server {
    listen 80;
    listen [::]:80;
    server_name clearpane.abu.rocks;
    root /var/www/public_domain/clearpane;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name cdn-static-3.abu.rocks;
    root /var/www/public_domain/cdn-static-3;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name halcyon-strategies.h7tex.com;
    root /var/www/public_domain/halcyon-strategies;
    index index.html;
    location = /.well-known/security.txt { default_type text/plain; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name openpgpkey.abu.rocks;
    root /var/www/public_domain/openpgpkey;
    # Web Key Directory: keys served as binary with permissive CORS; no directory index elsewhere.
    location /.well-known/openpgpkey/ {
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location / { return 404; }
}
