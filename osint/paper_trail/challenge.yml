name: Paper Trail
author: abu
category: osint
difficulty: easy
description: |
  A print artist, Mara Chen, is at the centre of an authenticity dispute, and someone dumped a
  folder of her working files onto the web. She insists her private "recovery code" was never written
  down anywhere online - yet she's the kind of person who over-shares. Start with her public statement,
  sift through the leaked bundle, and run down the one detail that leads to the code. Not everything in
  the folder is what it claims to be, so corroborate before you commit. Recover the code.

  (Everything you need is inside the bundle. No live internet required.)
sub_description: |
  Dig through a leaked bundle of a print artist's files and recover her private recovery code.
points: 200
flags:
  - type: static
    flag: "H7CTF{m3t4d4t4_g0ld3n_thr34d_0s1nt}"
handout:
  - name: paper-trail.zip
tags: [osint]
