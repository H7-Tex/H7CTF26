name: Meridian Pay
author: abu
category: mobile
difficulty: hard
description: |
  Meridian Pay is a neobank that shipped in a hurry and trusts everyone: the client trusts the server, the server trusts the client, and both trust the phone underneath. Four separate cracks are hiding in that arrangement, some in the app and some in the API behind it, one flag each.

  Move fast, break banks.
sub_description: |
  Find all four flaws across the neobank's app and API, one flag apiece.
flags:
  - { type: dynamic, name: v1, dynamic_flag_prefix: "H7CTF{", points: 10 }
  - { type: dynamic, name: v2, dynamic_flag_prefix: "H7CTF{", points: 20 }
  - { type: dynamic, name: v3, dynamic_flag_prefix: "H7CTF{", points: 30 }
  - { type: dynamic, name: v4, dynamic_flag_prefix: "H7CTF{", points: 40 }
points: 800
handout:
  - name: meridian-pay-3.2.1.apk.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/meridian-pay
  cpu_limit: "1.0"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 3
tags: [mobile, android]
