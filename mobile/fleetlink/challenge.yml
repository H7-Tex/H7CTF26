name: FleetLink
author: abu
category: mobile
difficulty: hard
description: |
  FleetLink is the Android app our delivery drivers use to pull their trip assignments. We
  shipped version 4.1.0 and stood up a staging API for your review. The backend is locked
  down - each driver only ever sees their own trips.

  Point the app at your instance and load your trips. Then get the backend to give up
  something a driver was never meant to see: the dispatcher-only fleet manifest. Its value
  is minted per team by your instance. Recover it.
sub_description: |
  Recover the dispatcher-only fleet manifest from the FleetLink driver app and its API.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: fleetlink-4.1.0.apk.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/fleetlink
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 3
tags: [mobile, android]
