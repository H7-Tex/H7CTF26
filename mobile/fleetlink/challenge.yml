name: Signed, Sealed, Delivered
author: abu
category: mobile
difficulty: hard
description: |
  FleetLink is the Android app our delivery drivers use to pull their trip assignments. The backend is locked down, and each driver only ever sees their own trips.

  Get it to give up the dispatcher-only fleet manifest, the one no driver was ever meant to see.
sub_description: |
  Recover the dispatcher-only fleet manifest from the FleetLink driver app.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: fleetlink-4.1.0.apk.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/fleetlink
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 3
tags: [mobile, android]
