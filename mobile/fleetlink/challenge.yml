name: Signed, Sealed, Delivered
author: abu
category: mobile
difficulty: medium
description: |
  FleetLink is what our delivery drivers use to pull their trip sheets, and the backend is careful: it hands each driver their own trips and nothing else. Above all that sits the dispatcher's full fleet manifest, the one no driver is ever meant to see.

  Sign for it yourself.
sub_description: |
  Get the dispatcher-only fleet manifest the driver app never asks for.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: fleetlink-4.1.0.apk.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/fleetlink
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 3
tags: [mobile, android]
