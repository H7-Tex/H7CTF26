name: FleetLink
author: abu
category: mobile
difficulty: hard
description: |
  FleetLink is the Android app our delivery drivers use to pull their trip assignments. We
  shipped version 4.1.0 and stood up a staging API for your review. Every call the app makes
  is signed - which is good, until you look at how.

  Point the app at your instance and load your trips. Then get the app to show you something
  it was never meant to. The dispatcher manifest is minted per team by your instance.
sub_description: |
  Android fleet app + signed REST API. Reverse the request-signing scheme and forge a call
  the app never makes to read the dispatcher-only fleet manifest.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: fleetlink-4.1.0.apk
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/fleetlink
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 3
tags: [mobile, android, reverse-engineering, request-signing, hmac, api, broken-access-control]
