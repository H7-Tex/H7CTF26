name: Onyx Locker
author: abu
category: mobile
difficulty: easy
description: |
  Onyx Locker is a personal password manager for Android. Its developers were sure the vault's recovery code was safe on the device.

  See if they were right. Recover it.
sub_description: |
  Recover the Onyx Locker vault's recovery code from the Android app.
points: 150
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: onyx-locker-2.4.0.apk.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/onyx-locker
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 3
tags: [mobile, android]
