name: Onyx Locker
author: abu
category: mobile
difficulty: easy
description: |
  Onyx Locker is a personal password manager for Android. We shipped version 2.4.0 and
  stood up a staging sync server for your review. Install it, point it at your instance,
  and unlock the vault - then take a hard look at how the app keeps your secrets when the
  screen is off.

  Your instance and the APK are shown when the challenge opens. The vault's recovery code
  is minted per team by your instance.
sub_description: |
  Android password manager + sync server. Recover the vault recovery code from the way the
  app stores it at rest.
points: 150
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: onyx-locker-2.4.0.apk.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/onyx-locker
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 3
tags: [mobile, android, debuggable, insecure-storage, hardcoded-key, crypto, aes]
