name: Help Yourself
author: abu
category: mobile
difficulty: medium
description: |
  Deskline runs the support desk our agents live in all day, one ticket queue that never stops refilling. Tucked in among the customer complaints is a single note marked agent-only, and the desk is quite sure you'll never reach it.

  So help yourself.
sub_description: |
  Recover the one queue note stamped agent-only.
points: 200
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: deskline-1.6.0.apk.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/deskline
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 3
tags: [mobile, android]
