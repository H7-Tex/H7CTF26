name: Onyx Locker
author: abu
category: mobile
difficulty: easy
description: |
  Onyx Locker keeps all your secrets on the phone, never in the cloud, exactly as promised. The vault's recovery code sits right there on the device, sealed up tight and yours alone.

  Yours, and anyone who bothers to look.
sub_description: |
  Recover the recovery code the vault swears is safe.
points: 150
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: onyx-locker-2.4.0.apk.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/onyx-locker
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 3
tags: [mobile, android]
