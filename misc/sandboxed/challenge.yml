name: Out of the Box
author: abu
category: misc
difficulty: easy
description: |
  We built an evaluator and locked it down. Your input runs in a stripped environment, screened before it executes. A flag sits on the box, well out of the sandbox's reach.

  Read it anyway.
sub_description: |
  Break out of a locked-down code evaluator and read the flag it guards.
points: 200
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: sandboxed.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/sandboxed
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [misc]
