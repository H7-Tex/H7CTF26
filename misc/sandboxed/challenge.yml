name: Sandboxed
author: abu
category: misc
difficulty: easy
description: |
  We built a "safe" Python expression evaluator. It strips every dangerous name out of the
  namespace and screens your input against a denylist before running it. There's a flag in
  /flag.txt on the box - you shouldn't be able to reach it. Prove us wrong.

  The evaluator's source is attached. Connect to your instance and send one expression per line.
sub_description: |
  A Python pyjail: empty builtins + a substring denylist. Escape it and read /flag.txt. Source
  provided.
points: 200
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: sandboxed.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/sandboxed
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [misc, pyjail, sandbox-escape, python]
