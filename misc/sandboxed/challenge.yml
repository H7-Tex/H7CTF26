name: Sandboxed
author: abu
category: misc
difficulty: easy
description: |
  We built a "safe" Python expression evaluator and locked it down: your input runs in a
  stripped-down environment, and we screen what you send before it ever executes. There's a
  flag in /flag.txt on the box - the sandbox is supposed to keep it out of reach. Prove us
  wrong.

  The evaluator's source is attached. Connect to your instance and send one expression per line.
sub_description: |
  Get a locked-down Python expression evaluator to read /flag.txt for you. Source provided.
points: 200
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: sandboxed.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/sandboxed
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [misc]
