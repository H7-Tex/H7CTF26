name: Out of the Box
author: abu
category: misc
difficulty: easy
description: |
  They stood up an expression evaluator, emptied the room it runs in, and put a bouncer on the door to turn away anything dangerous. The flag sits on the same box, just out of the room's reach.

  Read it anyway.
sub_description: |
  Get out of a bare little room and read the flag it was built to keep from you.
points: 200
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: sandboxed.zip
    path: challenge/sandboxed.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/sandboxed
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [misc]
