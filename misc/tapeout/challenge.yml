name: Tapeout
author: abu
category: misc
difficulty: hard
description: |
  FoundryProof stamps every chip before tape-out: prove your netlist matches the golden reference and it signs off, then probes the finished part once to catch anyone who got cute. We think it is airtight.

  Walk out certified, and leave the auditor something to find.
sub_description: |
  Earn a design the certifier blesses and the audit wishes it hadn't.
points: 400
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - name: tapeout.zip
    path: challenge/tapeout.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/tapeout
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [misc]
