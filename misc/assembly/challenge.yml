name: Assembly Line
author: abu
category: misc
difficulty: easy
description: |
  The Sparrow Freight sorting line never slows down: a long run of tiny jobs, each on a short clock, far more than any pair of hands can chase.

  Clear the whole shift and the line signs out the day's code.
sub_description: |
  Keep pace with a long run of timed tasks until the line hands over its code.
points: 150
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout: []
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/assembly-line
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [misc]
