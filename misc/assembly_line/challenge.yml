name: Assembly Line
author: abu
category: misc
difficulty: easy
description: |
  The Sparrow Freight sorting line moves fast: a long run of small tasks, each on a short clock, with no way to keep up by hand.

  Clear the whole run and the line hands over the day's code.
sub_description: |
  Clear a long run of timed tasks fast enough that the line hands over its code.
points: 150
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout: []
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/assembly-line
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [misc]
