name: Frozen Assets
author: abu
category: forensics
difficulty: hard
description: |
  A finance workstation, DESKTOP-M-HALE, got hit — every file on its E: drive is encrypted. Its antivirus caught and quarantined the payload before the sweep finished, so the sample is still sitting in the incident image.

  Recover the sample, work out how it locks files, and restore the E: drive. The flag is in one of the recovered files.
sub_description: |
  Recover a quarantined malware sample from a workstation's incident image, work out how it locks files, and restore the encrypted E: drive.
points: 500
flags:
  - type: static
    flag: "H7CTF{750b6f18160c332f9f2b}"
handout:
  - name: IR-DESKTOP-M-HALE.zip
    path: challenge/IR-DESKTOP-M-HALE.zip
tags: [forensics, dfir]
