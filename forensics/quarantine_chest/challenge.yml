name: Cold Vault
author: abu
category: forensics
difficulty: hard
description: |
  A finance workstation (DESKTOP-M-HALE) got hit: every file on its E: drive is encrypted.
  The good news - the endpoint's antivirus caught and quarantined the payload before it
  finished its sweep, so the sample itself is still sitting in the incident image. The bad
  news - the only record of how the files were locked lives inside that sample.

  Recover the quarantined sample, work out how it encrypts, and get the E: drive files back.
  The flag is in one of them.
sub_description: |
  Recover the quarantined malware sample from a finance workstation's incident image, work
  out how it locks files, and restore the encrypted E: drive.
points: 500
flags:
  - type: static
    flag: "H7CTF{c0ld_v4ult_r3c0v3ry_7_0f_7}"
handout:
  - name: IR-DESKTOP-M-HALE.zip
tags: [forensics, dfir]
