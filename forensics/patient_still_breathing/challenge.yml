name: The Patient Is Still Breathing
author: abu
category: forensics
difficulty: insane
description: |
  03:14 — an alert fires on ci-runner-03, the build server behind our payment SDK. The box is live and the actor may still be on it; don't reboot, or whatever lives only in memory is gone. You have an analyst SSH shell with sudo.

  Reconstruct the intrusion and capture what a reboot would erase. Four flags, each leading to the next.

  Connect:  ssh <your-team-key>@<host shown when you launch>
sub_description: |
  A live, compromised build server over SSH. Reconstruct the attack chain and capture the volatile evidence before a reboot wipes it. Four gated flags.
flags:
  - { type: dynamic, name: v1, dynamic_flag_prefix: "H7CTF{", points: 10 }
  - { type: dynamic, name: v2, dynamic_flag_prefix: "H7CTF{", points: 20 }
  - { type: dynamic, name: v3, dynamic_flag_prefix: "H7CTF{", points: 30 }
  - { type: dynamic, name: v4, dynamic_flag_prefix: "H7CTF{", points: 40 }
points: 1000
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/patient-still-breathing
  cpu_limit: "1.0"
  memory_limit: 512Mi
  # live SSH box: delivered via the SSH bastion/L4 path (not HTTP). needs SYS_PTRACE for
  # the intended /proc/<pid>/mem acquisition. per-team SSH key + FLAG_V1..V4 injected.
  cap_add: [SYS_PTRACE]
  exposed_ports:
    - { port: 22, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 3
tags: [forensics, dfir]
