name: Deleted, Not Gone
author: abu
category: forensics
difficulty: medium
description: |
  A phone was seized in a harassment case. The suspect used a chat app called Nova
  Messenger and swears they never sent anything incriminating - and the app shows no such
  message. But "delete" in an app usually just hides a row; the bytes tend to linger.

  We pulled the app's data. You have its message database (`messages.db`) and its
  preferences (`secure.xml`). Recover the message the suspect deleted.

  Nova stores message bodies obfuscated, not in the clear - the app is kind enough to keep
  the recipe (and the key) in its own settings.
sub_description: |
  A seized chat app's database and settings. One message was deleted; the row is gone but
  the bytes aren't. Recover it.
points: 300
flags:
  - type: static
    flag: "H7CTF{d3l3t3d_but_n0t_g0n3}"
handout:
  # both tiny -> Anvil attachments (also in-repo)
  - name: messages.db
  - name: secure.xml
tags: [forensics, mobile, android, sqlite, deleted-records, app-forensics]
