name: Gone Not Forgotten
author: abu
category: forensics
difficulty: medium
description: |
  A phone was seized in a harassment case. The suspect used a chat app called Nova Messenger and swears they never sent anything incriminating — and the app shows no such message. Investigators aren't convinced it's as clean as it looks.

  Recover the message the suspect got rid of and read what it said.
sub_description: |
  From a seized chat app's data, recover the message the suspect deleted.
points: 300
flags:
  - type: static
    flag: "H7CTF{7adf9695fb655c752810}"
handout:
  # messages.db + secure.xml packed into a zip (Anvil allows .zip); unzip to get both
  - name: evidence.zip
tags: [forensics, dfir]
