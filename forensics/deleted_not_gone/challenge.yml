name: Gone Not Forgotten
author: abu
category: forensics
difficulty: medium
description: |
  A phone was seized in a harassment case. The suspect used a chat app called Nova
  Messenger and swears they never sent anything incriminating - and the app shows no such
  message. Investigators aren't convinced the conversation is as clean as it looks.

  We pulled the app's data. You have its message database (`messages.db`) and its
  preferences (`secure.xml`), packed together in `evidence.zip` (unzip to get both). Recover
  the incriminating message the suspect got rid of and read what it said.
sub_description: |
  From a seized chat app's database and settings, recover the message the suspect deleted.
points: 300
flags:
  - type: static
    flag: "H7CTF{d3l3t3d_but_n0t_g0n3}"
handout:
  # messages.db + secure.xml packed into a zip (Anvil allows .zip); unzip to get both
  - name: evidence.zip
tags: [forensics, dfir]
