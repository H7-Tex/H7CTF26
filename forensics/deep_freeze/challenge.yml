name: Deep Freeze
author: abu
category: forensics
difficulty: hard
description: |
  At 03:14, ransomware tore through St. Cascade General's file server. Responders caught one nurse-station workstation still mid-encryption and captured its live memory before pulling the plug. The key it used never got wiped.

  Recover it, decrypt the locked file, and read what was inside.
sub_description: |
  A workstation's memory captured mid-encryption, plus one locked file — recover the key and decrypt it.
