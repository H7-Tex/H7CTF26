name: Ghost in the Timeline
author: abu
category: forensics
difficulty: medium
description: |
  An engineer is under investigation for leaking a confidential product roadmap. Their
  defense: the file on their laptop was created back in June, long before they had access
  to the sensitive share, and they insist they never staged or deleted anything. The
  file's timestamps back them up.

  We imaged their disk (`case_disk.img`, an ext4 filesystem). Your job is to test that
  story: establish when the roadmap was really handled, work out what the engineer actually
  did around that time, and recover what they took off the machine.
sub_description: |
  From a suspect's disk image, establish the true timeline of the "leaked" file and recover
  what the engineer took.
points: 300
flags:
  - type: static
    flag: "H7CTF{gh0st_1n_th3_t1m3l1n3}"
handout:
