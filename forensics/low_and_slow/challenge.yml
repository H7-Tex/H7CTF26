name: Low and Slow
author: abu
category: forensics
difficulty: medium
description: |
  For six weeks, nothing tripped. The DLP stayed green, AV stayed quiet, the SIEM had no
  signatures to fire on. Then a partner tipped us that our unreleased designs were being
  shopped around. Something has been talking to the outside this whole time, quietly, and
  it took data with it.

  You have a capture off the affected subnet (`capture.pcap`). Most of it is ordinary
  office traffic. Buried in it are two things: a channel that phones home on a schedule,
  and the exfiltration itself. Find the beacon, then recover what left the building.

  Open it in Wireshark / tshark / Zeek / scapy. The flag is the exfiltrated secret.
sub_description: |
  Six weeks of quiet traffic, no alerts, and data still left. Find the scheduled beacon
  and reassemble what it exfiltrated.
points: 300
flags:
  - type: static
    flag: "H7CTF{b3ac0n_1n_th3_dns_n01s3}"
handout:
  # small pcap (~144 KB) -> Anvil built-in attachment
  - name: capture.pcap
tags: [forensics, network, pcap, dns-tunnel, c2-beacon, dfir]
