name: Low and Slow
author: abu
category: forensics
difficulty: medium
description: |
  For six weeks, nothing tripped — no alerts, nothing out of place. Then a partner tipped us that our unreleased designs were being shopped around. Something on the network had been quietly talking to the outside the whole time, and it took data with it.

  Work out how the data was leaving and recover what left with it.
sub_description: |
  From a capture of a compromised subnet, work out how data was leaving and recover it.
points: 300
flags:
  - type: static
    flag: "H7CTF{b3ac0n_1n_th3_dns_n01s3}"
handout:
  # small pcap (~144 KB) -> Anvil built-in attachment
  - name: capture.pcap
tags: [forensics, dfir]
