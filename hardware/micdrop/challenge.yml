name: Mic Drop
author: abu
category: hardware
difficulty: medium
description: |
  The boardroom's always-on AV bridge got quietly compromised, and it still dutifully streams the room its live feed. Whoever owns it now is riding that same feed to walk secrets out the door.

  Nobody in the meeting hears a thing wrong. That is rather the point.
sub_description: |
  Recover what the implant on the bugged boardroom device is smuggling out through its live feed.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/mic-drop
  cpu_limit: "1.0"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
