name: Open Sesame
author: abu
category: hardware
difficulty: hard
description: |
  A bargain-bin garage remote swears it fires a brand-new, unguessable code on every single press. We loitered in the driveway long enough to catch eight.

  Turns out "unguessable" and "unpredictable" are not the same word.
sub_description: |
  Eight presses of the remote, recorded. Open the door on the ninth.
points: 450
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/roll-back
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
