name: Open Sesame
author: abu
category: hardware
difficulty: hard
description: |
  A cheap garage remote sends a fresh, unpredictable code on every press. We recorded eight of them.

  Work out the code it would send next, and open the door.
sub_description: |
  From eight recorded presses of a garage remote, work out the next code and open the door.
points: 450
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/roll-back
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
