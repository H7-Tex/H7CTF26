name: Roll Back
author: abu
category: hardware
difficulty: hard
description: |
  A cheap garage remote that is meant to send a fresh, unpredictable code on every
  press. We recorded eight button presses as raw complex baseband from a
  software-defined radio. The receiver ignores any code it has already seen, so a
  straight replay of a captured press does nothing.

  Launch your instance and download `capture.cf32` from its base URL (shown when you
  launch it): interleaved float32 I/Q, little-endian, fs = 1000000 Hz.

  Recover the codes the remote sent, work out the code it would transmit next, and send
  that to the receiver:
    POST /unlock   body: {"code": "<12 hex digits = the 48-bit frame>"}
  Open the door.
sub_description: |
  From eight recorded presses of a garage remote, send the code it would transmit next
  and open the door.
points: 450
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/roll-back
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
