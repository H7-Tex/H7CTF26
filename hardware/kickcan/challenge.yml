name: Kick the CAN
author: abu
category: hardware
difficulty: medium
description: |
  We spliced into a car's wiring while it was in for service and let the recorder run. Most of the traffic is the usual engine gossip, but two boxes were having a far more private conversation.

  One of them said too much.
sub_description: |
  From the vehicle capture, follow the private exchange and recover what one unit let slip.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/zero-day-highway
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
