name: Dog Whistle
author: abu
category: hardware
difficulty: insane
description: |
  Aria takes orders it can hear, and the equalizer is the only guard the vendor left you. Lately it keeps obeying instructions nobody in the room ever gave.

  Get it to give up the flag it keeps in firmware.
sub_description: |
  The equalizer is the only guard. Something keeps talking past it anyway.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: handout/dog_whistle.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/dog-whistle
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [hardware, dsp, binary-exploitation]
