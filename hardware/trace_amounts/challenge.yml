name: Trace Amounts
author: abu
category: hardware
difficulty: medium
description: |
  A contactless payment card keeps its key sealed in the chip and swears it never comes out. We watched it work a few thousand taps in a row.

  The key never left the card. Everything else did.
sub_description: |
  The key never leaves the card, they say. Recover it anyway, then open what it protects.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/trace-amounts
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
