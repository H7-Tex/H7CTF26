name: Trace Amounts
author: abu
category: hardware
difficulty: medium
description: |
  A contactless payment card guards a secret key in hardware and uses it to authorize each tap — the key never leaves the card. We captured a batch of authorizations: for each one, a physical measurement taken off the card as it worked, along with the known input it was asked to process.

  Recover the card's key and decrypt the sealed secret.
sub_description: |
  Recover a payment card's hidden key from captured measurements and known inputs, then decrypt the sealed secret.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/trace-amounts
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
