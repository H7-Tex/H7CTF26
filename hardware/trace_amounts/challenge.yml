name: Trace Amounts
author: abu
category: hardware
difficulty: hard
description: |
  A contactless payment card guards a secret key in hardware and uses it to authorize
  each tap — the key never leaves the card. We captured a batch of authorizations: for
  each one, a physical measurement taken off the card while it worked, together with the
  known challenge plaintext it was asked to process.

  Launch your instance and download the capture from its base URL (shown when you launch
  it): `traces.npy` (float32, N x samples), `plaintexts.npy` (uint8, N x 16), and
  `secret.enc` — the flag, encrypted by the card with its 16-byte key (AES-128-ECB,
  PKCS7 padding).

  Recover the card's key from the captured measurements and decrypt the secret.
sub_description: |
  Recover a smart card's hidden key from a batch of captured measurements and known
  plaintexts, then decrypt the sealed secret.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/trace-amounts
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
