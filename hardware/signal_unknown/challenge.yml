name: Radio Silence
author: abu
category: hardware
difficulty: medium
description: |
  We pulled a single burst off the air near a device nobody could identify - no datasheet, no protocol notes, nothing.

  Recover the message it carries.
sub_description: |
  A single captured burst from an unknown device - recover the message it carries.
points: 300
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/signal-unknown
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
