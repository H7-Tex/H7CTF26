name: Zero-Day Highway
author: abu
category: hardware
difficulty: hard
description: |
  We tapped the CAN bus of a connected vehicle through its OBD-II port during a service
  session. Most of the capture is routine powertrain chatter, but a diagnostic tool was
  talking to one of the vehicle's control units at the same time, and that unit handed
  back something it should not have.

  Launch your instance and download `capture.log` from its base URL (shown when you
  launch it). It is a SocketCAN candump log: `(timestamp) can0 ID#DATA`.

  Follow the exchange and recover what the control unit leaked.
sub_description: |
  From a vehicle's CAN bus capture, follow the diagnostic exchange and recover the data
  one control unit leaked.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/zero-day-highway
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
