name: Kick the CAN
author: abu
category: hardware
difficulty: medium
description: |
  We tapped a connected vehicle's internal network during a service session. Most of it is routine powertrain chatter, but a diagnostic tool was talking to one of the control units at the same time - and that unit handed back something it should not have.

  Recover what the control unit leaked.
sub_description: |
  From a vehicle's diagnostic capture, follow the exchange and recover what one control unit leaked.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/zero-day-highway
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
