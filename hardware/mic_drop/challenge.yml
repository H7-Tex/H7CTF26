name: Mic Drop
author: abu
category: hardware
difficulty: hard
description: |
  A "smart" conference-room AV unit — the boardroom's always-on mic-and-camera bridge — was quietly compromised. It still serves its normal live audio feed, but the implant is smuggling data out through that same feed.

  Recover what the implant is exfiltrating.
sub_description: |
  Recover what the implant on a bugged boardroom device is exfiltrating.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/mic-drop
  cpu_limit: "1.0"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
