name: Mic Drop
author: abu
category: hardware
difficulty: hard
description: |
  A "smart" conference-room AV unit (the boardroom's always-on mic and camera bridge)
  was quietly compromised. It still serves its normal live audio feed to the building
  dashboard, but the implant is using that same feed to carry data out in the clear,
  where nobody thinks to look.

  We are tapping the device's live stream. Launch your instance and pull the HLS stream
  from its base URL (shown when you launch it):
    <base-url>/boardroom/index.m3u8
  Open it in VLC/ffmpeg/mpv, or fetch the segments directly. It is a normal-sounding
  room feed, but the audio carries more than conversation.

  Recover what the implant is exfiltrating.
sub_description: |
  A live HLS feed from a bugged boardroom AV device. The room audio is a cover; the
  implant is talking underneath it. Pull the stream and recover the message.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/mic-drop
  cpu_limit: "1.0"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware, av, streaming, hls, rtsp, audio-forensics, afsk]
