name: Mic Drop
author: abu
category: hardware
difficulty: hard
description: |
  A "smart" conference-room AV unit (the boardroom's always-on mic and camera bridge)
  was quietly compromised. It still serves its normal live audio feed to the building
  dashboard, but the implant is using that same feed to smuggle data out, hidden where
  nobody thinks to listen.

  We are tapping the device's live stream. Launch your instance and pull the stream from
  its base URL (shown when you launch it):
    <base-url>/boardroom/index.m3u8
  It sounds like a normal room feed, but there is more than conversation in the audio.

  Recover what the implant is exfiltrating.
sub_description: |
  Pull the live audio stream from a bugged boardroom device and recover what the implant
  is exfiltrating.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/mic-drop
  cpu_limit: "1.0"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
