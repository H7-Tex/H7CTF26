name: GridWatch
author: abu
category: hardware
difficulty: insane
description: |
  GridWatch is the operator console for a 33kV substation feeder, and only one operator can hold the seat at a time.

  King of the Hill: take the operator seat and hold it. The seat resets periodically, so expect to take it again.
sub_description: |
  King of the Hill: take the substation operator seat and hold it.
scoring: koth
koth:
  status_path: /koth/status
  tick_seconds: 15
  points_per_tick: 10
deploy:
  resource_type: docker
  instancing: static
  image: h7ctf26/gridwatch-koth
  cpu_limit: "2.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
tags: [hardware]
