name: Hear No Evil
author: abu
category: hardware
difficulty: medium
description: |
  A pair of NoiseGate earbuds wakes up and starts gossiping with its phone app, and they are not the only ones chattering on the air. You were listening to all of it.

  Two things in that noise were meant to stay private. Take both.
sub_description: |
  From the wireless capture of the earbuds and their app, recover the two secrets hidden in the traffic.
points: 500
flags:
  - type: dynamic
    name: v1
    dynamic_flag_prefix: "H7CTF{"
    points: 40
  - type: dynamic
    name: v2
    dynamic_flag_prefix: "H7CTF{"
    points: 60
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/noisegate-earbuds
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
