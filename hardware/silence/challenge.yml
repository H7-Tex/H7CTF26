name: Radio Silence
author: abu
category: hardware
difficulty: medium
description: |
  A single burst went out over the air next to a device nobody can name. No datasheet, no protocol notes, not so much as a label on the case.

  Whatever it said, it only said once. Read it back.
sub_description: |
  From one captured burst off an unknown device, recover the message it carries.
points: 300
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/signal-unknown
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
