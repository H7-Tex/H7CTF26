name: Hear No Evil
author: abu
category: hardware
difficulty: medium
description: |
  We sniffed a pair of NoiseGate wireless earbuds powering on and talking to their companion app. They are not the only thing on the air.

  Two secrets are hidden in the traffic. Recover both.
sub_description: |
  From a wireless capture of a pair of earbuds and their app, recover the two hidden secrets.
points: 500
flags:
  - type: dynamic
    name: v1
    dynamic_flag_prefix: "H7CTF{"
    points: 40
  - type: dynamic
    name: v2
    dynamic_flag_prefix: "H7CTF{"
    points: 60
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/noisegate-earbuds
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
