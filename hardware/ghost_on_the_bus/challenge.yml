name: Ghost on the Bus
author: abu
category: hardware
difficulty: medium
description: |
  We clipped onto a NoiseGate board and let it boot while we wrote down everything the chips muttered to each other. Somewhere in that wake-up routine the device hands its provisioning key across.

  It never says the whole thing in one place. Ghosts are like that.
sub_description: |
  Recover the provisioning key from the NoiseGate board's boot-time capture.
points: 400
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/ghost-on-the-bus
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
