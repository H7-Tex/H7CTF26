name: Ghost on the Bus
author: abu
category: hardware
difficulty: medium
description: |
  We tapped the boot sequence of a NoiseGate device and recorded every line on the
  board at once as it powered up. The device's provisioning key passes through during
  that boot, but reading the capture as text finds nothing — you have to make sense of
  what the hardware is actually doing.

  Launch your instance and download `capture.vcd` from its base URL (shown when you
  launch it) and open it in a digital-waveform viewer.

  Recover the provisioning key.
sub_description: |
  Recover the provisioning key from a boot-time logic capture of a NoiseGate device.
points: 400
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/ghost-on-the-bus
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
