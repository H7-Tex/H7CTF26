name: Ghost on the Bus
author: abu
category: hardware
difficulty: medium
description: |
  We tapped a NoiseGate device as it powered up and recorded every line on the board at once. Its provisioning key passes through during that boot.

  Recover the provisioning key.
sub_description: |
  Recover the provisioning key from a NoiseGate device's boot-time capture.
points: 400
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/ghost-on-the-bus
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware]
