name: Ghost on the Bus
author: abu
category: hardware
difficulty: medium
description: |
  We tapped the boot sequence of a NoiseGate device with an 8-channel logic
  analyzer. Three buses are live at once: a UART boot log, an SPI flash read, and
  an I2C EEPROM read. The provisioning key is split across the SPI and I2C reads,
  and the boot log tells you how to put it back together.

  Launch your instance and download `capture.vcd` from its base URL (shown when you
  launch it). Open it in PulseView / sigrok (2 MHz sample rate). Channels:
  `UART_TX, SCL, SDA, SPI_CLK, SPI_MOSI, SPI_MISO, SPI_CS, AUX`.

  Recover the provisioning key.
sub_description: |
  One 8-channel boot capture, three buses at once, and a key that lives in none of
  them alone.
points: 400
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/ghost-on-the-bus
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 1800
  max_extensions: 2
tags: [hardware, logic-analyzer, spi, i2c, uart, sigrok]
