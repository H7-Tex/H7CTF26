name: Trustfall CI
author: Owatron
category: devsecops
difficulty: hard

description: |
  Trustfall CI automates the whole delivery pipeline now - scanning, review, approvals, release. They even gave parts of it agents. Very efficient. Probably fine.

  Reach production and recover the protected secret.
sub_description: |
  Modern DevSecOps has fewer humans in the loop. Surely that's an improvement.
points: 500

flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"

deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/trustfall_ci
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - port: 8080
      protocol: http
  instance_timeout: 1800
  max_extensions: 2
