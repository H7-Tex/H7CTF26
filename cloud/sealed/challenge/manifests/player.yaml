---
# Player foothold - a restricted ServiceAccount + pod in the default namespace.
# The player gets a kubeconfig for this SA (generated by setup.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: player
  namespace: default

---
# player can enumerate ingress-nginx services/configmaps (to find flag1 + webhook)
# but CANNOT read secrets in any namespace and CANNOT exec into pods
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sealed-player
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "namespaces", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sealed-player
subjects:
  - kind: ServiceAccount
    name: player
    namespace: default
roleRef:
  kind: ClusterRole
  name: sealed-player
  apiGroup: rbac.authorization.k8s.io

---
# Foothold pod - the player's in-cluster presence
apiVersion: v1
kind: Pod
metadata:
  name: foothold
  namespace: default
spec:
  serviceAccountName: player
  containers:
    - name: shell
      image: curlimages/curl:8.6.0
      command: ["sleep", "86400"]
      resources:
        requests: {cpu: "10m", memory: "32Mi"}
        limits: {cpu: "100m", memory: "64Mi"}
  restartPolicy: Always
