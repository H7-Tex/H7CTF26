---
# flag1 — discoverable by cluster recon with the player SA.
# Player can list/get configmaps in ingress-nginx → finds the webhook + flag.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-info
  namespace: ingress-nginx
data:
  admission-webhook: "ingress-nginx-controller-admission.ingress-nginx.svc:443"
  note: "this webhook is unauthenticated and reachable from any pod in-cluster"
  flag: "H7CTF{unauthenticated_webhook_attack_surface}"

---
# nginx controller ConfigMap — fix: no include trick, just client_body_in_file_only
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
data:
  worker-processes: "1"
  http-snippet: "client_body_in_file_only on;"

---
# flag2 — readable only from inside the controller pod (via RCE payload)
# Mounted at /run/secrets/sealed/flag in the controller container
apiVersion: v1
kind: Secret
metadata:
  name: sealed-flag2
  namespace: ingress-nginx
type: Opaque
stringData:
  flag: "H7CTF{rce_as_controller_service_account}"

---
# flag3 — cross-namespace secret; readable via controller SA's cluster-wide list-secrets
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: v1
kind: Secret
metadata:
  name: crown-jewels
  namespace: vault
type: Opaque
stringData:
  flag: "H7CTF{cluster_wide_secret_theft_complete}"
  note: "ingress-nginx SA has secrets:list cluster-wide — every secret in every namespace"
