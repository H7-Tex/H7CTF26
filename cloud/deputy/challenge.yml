name: Deputy
author: abu
category: cloud
difficulty: hard
description: |
  DeputyCorp is a cloud deployment partner your company integrated with. You've been handed a low-privilege analyst key into the account and asked how far a careless integration really lets you go.

  Point the AWS CLI at the endpoint and escalate. Four flags, deeper each stage.

  Endpoint: http://<your-instance-host>:<port>   (use as `--endpoint-url`)
  Starting credentials (analyst):
    aws_access_key_id     = AKIAANALYST0000000000
    aws_secret_access_key = wJalrAnalystSecretKeyEXAMPLEbPxRfiCY
    region                = us-east-1
sub_description: |
  A simulated AWS account you drive with the real AWS CLI. Start from a low-privilege key and escalate. Four flags.
points: 1500
flags:
  - { type: static, name: recon,      flag: "H7CTF{d6cc592f5a2f3db80718}", points: 10 }
  - { type: static, name: passrole,   flag: "H7CTF{28f87391f8a228110839}", points: 20 }
  - { type: static, name: admin,      flag: "H7CTF{ea3e1dba8012d76e2648}", points: 30 }
  - { type: static, name: externalid, flag: "H7CTF{1dbe909840d15aabdd63}", points: 40 }
deploy:
  # self-contained single container; standard gVisor profile (confirmed w/ Finals — no runc, no privesc)
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/deputy
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 5400
  max_extensions: 4
tags: [cloud, aws, iam, privesc, confused-deputy]
