name: Freightpipe
author: abu
category: b2r
difficulty: insane
description: |
  Sparrow Freight runs everything through Freightpipe, their self-hosted software factory: a git server, a build pipeline, an image registry, and an auto-deploying production host, all wired together and watched by a deploy bot. Recon turned up a credential someone thought they'd cleaned up.

  See how far a leaked token gets you through the pipeline, and whether you can own the factory itself.
sub_description: |
  A self-hosted CI/CD box. Start from a leaked token and work through the pipeline until you own the factory host. Four flags, recon to root.
points: 1800
flags:
  - { type: static, name: recon, flag: "H7CTF{fl4g1_l34k3d_t0k3n_in_g1t_h1st0ry}", points: 10 }
  - { type: static, name: user,  flag: "H7CTF{1ppe_p01s0n3d_th3_sh4r3d_bu1ld_scr1pt}", points: 20 }
  - { type: static, name: prod,  flag: "H7CTF{f0rg3d_hm4c_d3pl0y3d_my_b4ckd00r_1m4g3}", points: 30 }
  - { type: static, name: root,  flag: "H7CTF{tru5t3d_w00dp3ck3r_pr1v_st3p_0wn3d_th3_f4ct0ry}", points: 40 }
deploy:
  # ONE sysbox pod runs the whole docker-compose stack (nested unprivileged Docker). Finals builds the
  # pod image that runs `docker compose up` internally. Needs runc+sysbox (NOT gVisor) — the stage-4
  # trusted-repo step runs privileged. See DEPLOY.md for the full deploy contract.
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/freightpipe            # sysbox pod image (compose-in-pod); built by Finals
  runtime: sysbox                        # nested Docker + privileged stage-4 step
  privesc: true                          # allowPrivilegeEscalation:true (no_new_privs off)
  cpu_limit: "2.0"
  memory_limit: 3Gi                      # gitea+woodpecker(server+agent)+registry+prod+bot+CI jobs
  exposed_ports:
    - { port: 3000, protocol: http }     # Gitea web + git http
    - { port: 22,   protocol: tcp }      # Gitea ssh (optional)
    - { port: 8000, protocol: http }     # Woodpecker (read-only build logs)
    - { port: 9000, protocol: http }     # prod app + /deploy webhook
  instance_timeout: 7200
  max_extensions: 4
tags: [b2r, cicd, supply-chain, docker, gitea, woodpecker]
