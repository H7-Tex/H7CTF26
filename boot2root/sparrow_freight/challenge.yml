name: Rat Race
author: abu
category: b2r
difficulty: hard
description: |
  Sparrow Freight handed you a low-privilege account on one of their ops boxes and asked how far a foothold really gets. There's a user flag in the ops engineer's home and a root flag for whoever owns the box.

  Work your way up.

  Access: ssh guest@<your-instance-host> -p <port>   (password: guest)
sub_description: |
  A Linux box. Start from the guest account and work up to both flags (user + root).
points: 500
flags:
  - { type: static, name: user, flag: "H7CTF{14b8dba38cef51b37678}", points: 40 }
  - { type: static, name: root, flag: "H7CTF{d635334c4a8563c01e1b}", points: 60 }
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/sparrow-b2r
  privesc: true            # SUID/no_new_privs-off step. GKE gVisor REJECTS allowPrivilegeEscalation at admission, so the instancer must route privesc:true to the sysbox-runc pool (same bucket as Freightpipe). drop-ALL caps still fine.
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 22, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 3
tags: [boot2root, linux]
