name: Safe Space
author: abu
category: pwn
difficulty: medium
description: |
  The vault will run any code you hand it — it even gives you room to put it in. The trouble is the door
  only opens so far, so simply asking for a shell won't get you anywhere. Work within what it allows and
  take what you came for.

  Connect to your instance. The binary and its libraries are attached.
sub_description: |
  A networked binary that runs code you send it, within limits. Send code that reads the flag.
points: 300
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/vault.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/vault
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
