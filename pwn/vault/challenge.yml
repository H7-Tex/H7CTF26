name: Safe Space
author: abu
category: pwn
difficulty: medium
description: |
  The vault throws its doors wide and lets you set up shop inside. There is only one move it will not tolerate, and wouldn't you know it, that is exactly the one you had planned.

  You will have to take what you came for the long way around.
sub_description: |
  Read the flag the long way around.
points: 300
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/vault.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/vault
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
