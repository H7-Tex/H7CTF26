name: Manifest Destiny
author: abu
category: pwn
difficulty: medium
description: |
  Sparrow Freight keeps its cargo manifest under admin clearance, which is not something they planned on giving you. Good thing the terminal loves feedback and takes your every word to heart.

  Some of us are just destined for management.
sub_description: |
  Get yourself admin clearance and read the manifest.
points: 250
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/manifest.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/manifest
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
