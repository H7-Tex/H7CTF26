name: Manifest Destiny
author: abu
category: pwn
difficulty: medium
description: |
  The Sparrow Freight manifest terminal won't show you the cargo list without admin clearance — but its
  feedback form repeats a little too much of what you tell it. Talk your way up to admin and read the
  clearance code.

  Connect to your instance. The binary and its libraries are attached.
sub_description: |
  A networked binary. Get admin clearance and read the flag.
points: 250
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/manifest.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/manifest
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
