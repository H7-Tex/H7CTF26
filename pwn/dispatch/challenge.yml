name: Parcel Bomb
author: abu
category: pwn
difficulty: medium
description: |
  Sparrow Freight dispatch takes your waybill number, logs it, and waves you off. Trouble is, the intake clerk never learned when to stop listening.

  No spare key was left out this time, so bring your own way in.
sub_description: |
  Force your own way in and read the flag.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/dispatch.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/dispatch
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
