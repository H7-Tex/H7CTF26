name: Special Delivery
author: abu
category: pwn
difficulty: medium
description: |
  The Sparrow Freight dispatch terminal takes a waybill number and logs it — into a space far too small
  to hold it. There's no shortcut waiting inside this time, so you'll have to bring your own way through.
  Get a foothold and read the flag.

  Connect to your instance. The binary and the exact libraries it runs against are attached.
sub_description: |
  A networked binary; the exact libraries it runs against are provided. Get a foothold and read the flag.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/dispatch.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/dispatch
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
