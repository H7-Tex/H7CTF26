name: Hothouse
author: abu
category: pwn
difficulty: hard
description: |
  A firmware control link for a cellular-automaton coprocessor. Load a seed lattice, let it incubate for a few generations, and fire the settled fabric on the core.

  Coax the fabric into doing something it was never meant to, and read the flag off the box.
sub_description: |
  You do not write to the core. You plant a seed and hope it grows up right.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: handout/hothouse.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/hothouse
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation, shellcode]
