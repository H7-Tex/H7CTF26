name: Loose Ends
author: abu
category: pwn
difficulty: hard
description: |
  Sparrow Freight keeps its books on a scratchpad ledger, and the clerk who crosses out old entries is not half as thorough as he believes. There is also an audit that reads the day's clearance code aloud, which nobody has ever bothered to call.

  Tie up the loose ends.
sub_description: |
  Make the audit run, and read the flag.
points: 450
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/ledger.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/ledger
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
