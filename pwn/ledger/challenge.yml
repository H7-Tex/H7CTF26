name: Loose Ends
author: abu
category: pwn
difficulty: hard
description: |
  The Sparrow Freight note ledger lets you add, delete, edit and view entries, but delete is a little forgetful about what it lets go of. An audit routine prints the day's clearance code, and nothing ever calls it.

  Arrange for it to run anyway.
sub_description: |
  A networked binary. Reach the audit routine that prints the flag.
points: 450
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/ledger.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/ledger
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
