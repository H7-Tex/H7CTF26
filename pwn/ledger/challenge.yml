name: Loose Ends
author: abu
category: pwn
difficulty: hard
description: |
  The Sparrow Freight note ledger lets you add, delete, edit and view entries — but "delete" turns out
  to be a little forgetful about what it lets go of. There's an audit routine that prints the day's
  clearance code, and nothing ever calls it. Arrange for it to run anyway.

  Connect to your instance. The binary and the exact libraries it runs against are attached.
sub_description: |
  A networked binary; the exact libraries it runs against are provided. Reach the audit routine.
points: 450
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/ledger.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/ledger
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
