name: Papers Please
author: abu
category: pwn
difficulty: easy
description: |
  The Sparrow Freight border terminal logs your name and waves you back. Somewhere in it is a routine
  that would clear you straight through — find a way to make the terminal run it, and read your
  clearance code.

  Connect to your instance. The binary and the libraries it runs against are attached.
sub_description: |
  A networked binary. Get it to clear you through and read the flag.
points: 150
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/checkpoint.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/checkpoint
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
