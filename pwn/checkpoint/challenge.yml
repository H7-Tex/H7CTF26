name: Papers Please
author: abu
category: pwn
difficulty: easy
description: |
  The Sparrow Freight border checkpoint takes down your name, denies you entry, and tells you to turn back. Somewhere behind the booth is the stamp that waves people straight through, and the guard is not going to reach for it on your account.

  So reach for it yourself.
sub_description: |
  Get yourself waved through and read the clearance code.
points: 150
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: challenge/checkpoint.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/checkpoint
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 9999, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [pwn, binary-exploitation]
