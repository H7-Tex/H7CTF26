# The Ladder — graded challenge container_spec (7 roles). Hand to Finals-2 to create ad-hoc via
# the admin API (scoring_mode=graded, base_points=1000, difficulty=insane). Anvil fills the
# ${...} placeholders in the GRADER role env ONLY; a public role referencing GRADER_SECRET is
# refused at launch. Shared pod localhost: grader pushes tokens to 127.0.0.1:910k, portal reaches
# the grader at 127.0.0.1:9000, players reach the tiers on 9001-9005 and the portal on 8080.
# (Exact admin-API field names — image refs, port exposure — Finals-2 confirms against the live
#  graded schema; this is the topology + env contract.)
scoring_mode: graded
base_points: 1000
difficulty: insane

services:
  # ---- public: the 5 hardening rungs, each isolated so popping one can't read another's token ----
  - name: tier-v1_0
    image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/h7ctf26/aegis-graded-tier
    public: true
    ports: [{ port: 9001, protocol: tcp }]
    env: { TIER: "gateway_v1.0", PORT: "9001", CTRL_PORT: "9101" }
  - name: tier-v1_4
    image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/h7ctf26/aegis-graded-tier
    public: true
    ports: [{ port: 9002, protocol: tcp }]
    env: { TIER: "gateway_v1.4", PORT: "9002", CTRL_PORT: "9102" }
  - name: tier-v2_0
    image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/h7ctf26/aegis-graded-tier
    public: true
    ports: [{ port: 9003, protocol: tcp }]
    env: { TIER: "gateway_v2.0", PORT: "9003", CTRL_PORT: "9103" }
  - name: tier-v2_6
    image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/h7ctf26/aegis-graded-tier
    public: true
    ports: [{ port: 9004, protocol: tcp }]
    env: { TIER: "gateway_v2.6", PORT: "9004", CTRL_PORT: "9104" }
  - name: tier-v3_0
    image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/h7ctf26/aegis-graded-tier
    public: true
    ports: [{ port: 9005, protocol: tcp }]
    env: { TIER: "gateway_v3.0", PORT: "9005", CTRL_PORT: "9105" }
  # ---- public: submission surface, NO secret ----
  - name: portal
    image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/h7ctf26/aegis-graded-portal
    public: true
    ports: [{ port: 8080, protocol: http }]
    env: { GRADER: "http://127.0.0.1:9000" }
  # ---- internal: the only role with the secret + egress; mints/pushes tokens, verifies, reports ----
  - name: grader
    image: asia-south1-docker.pkg.dev/project-c36a8ca6-dbc7-4a90-9d2/anvil/h7ctf26/aegis-graded-grader
    public: false
    egress: true
    env:
      GRADER_SECRET: "${GRADER_SECRET}"
      GRADER_URL: "${GRADER_URL}"
      ANVIL_TEAM_ID: "${ANVIL_TEAM_ID}"
      INSTANCE_ID: "${INSTANCE_ID}"
      CHALLENGE_SLUG: "the-ladder"
      GRADER_PORT: "9000"
