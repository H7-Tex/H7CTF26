{% extends "base.html" %}
{% block title %}Policy · Astra Package Exchange{% endblock %}
{% block content %}
<section class="page-heading"><div><h1>Policy</h1><p class="page-description">Checks applied during package inspection.</p></div></section>
<section class="policy-header"><div><p class="policy-label">Policy revision</p><p id="policy-revision" class="policy-revision">Loading…</p></div><p id="policy-name" class="muted"></p></section>
<div class="table-frame"><div class="table-scroll">
  <table class="data-table"><thead><tr><th scope="col">Check</th><th scope="col">Description</th><th scope="col">Treatment</th></tr></thead><tbody id="policy-rows"><tr><td colspan="3" class="table-state">Loading policy…</td></tr></tbody></table>
</div></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='/js/inspections.js') }}" defer></script>{% endblock %}
