services:
  portal:
    build: .
    image: schrodinger-package:local
    command: ["python", "-m", "schrodinger.main", "portal"]
    environment:
      SCHRODINGER_ROLE: portal
      ARTIFACT_DATA_DIR: /var/lib/schrodinger
      INSPECTOR_URL: http://inspector:8081
      RUNTIME_URL: http://runtime:8082
      FLAG: ${FLAG:-}
      FLAG_FILE: /run/secrets/challenge_flag
    ports:
      - "8080:8080"
    volumes:
      - artifacts:/var/lib/schrodinger
      - ./flag.txt:/run/secrets/challenge_flag:ro
    depends_on:
      inspector:
        condition: service_healthy
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [portal_edge, portal_inspector, portal_runtime]

  inspector:
    image: schrodinger-package:local
    command: ["python", "-m", "schrodinger.main", "inspector"]
    environment:
      SCHRODINGER_ROLE: inspector
      ARTIFACT_DATA_DIR: /var/lib/schrodinger
    volumes:
      - artifacts:/var/lib/schrodinger
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [portal_inspector]

  runtime:
    image: schrodinger-package:local
    command: ["python", "-m", "schrodinger.main", "runtime"]
    environment:
      SCHRODINGER_ROLE: runtime
      ARTIFACT_DATA_DIR: /var/lib/schrodinger
    volumes:
      - artifacts:/var/lib/schrodinger:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 64
        hard: 64
      fsize:
        soft: 67108864
        hard: 67108864
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8082/health')); assert d['status']=='ok' and all(d['sandbox'].values())"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [portal_runtime]

volumes:
  artifacts:

networks:
  portal_inspector:
    driver: bridge
    internal: true
  portal_runtime:
    driver: bridge
    internal: true
  portal_edge:
    driver: bridge
