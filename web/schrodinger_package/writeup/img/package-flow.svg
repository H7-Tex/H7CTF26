<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Package processing flow</title>
  <desc id="desc">One immutable wheel is inspected, installed by Runtime, and evaluated by Portal before a transient flag response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}.t{font:600 17px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#334155}.a{stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="box" x="20" y="48" width="180" height="92"/><text class="t" x="110" y="82" text-anchor="middle">Immutable wheel</text><text class="s" x="110" y="108" text-anchor="middle">artifact ID + SHA-256</text>
  <rect class="box" x="285" y="20" width="190" height="65"/><text class="t" x="380" y="48" text-anchor="middle">Inspector</text><text class="s" x="380" y="69" text-anchor="middle">file inventory</text>
  <rect class="box" x="285" y="105" width="190" height="65"/><text class="t" x="380" y="133" text-anchor="middle">Runtime</text><text class="s" x="380" y="154" text-anchor="middle">install + import</text>
  <rect class="box" x="570" y="48" width="190" height="92"/><text class="t" x="665" y="82" text-anchor="middle">Portal</text><text class="s" x="665" y="108" text-anchor="middle">verify structural evidence</text>
  <rect class="box" x="845" y="48" width="135" height="92"/><text class="t" x="912" y="82" text-anchor="middle">Response</text><text class="s" x="912" y="108" text-anchor="middle">transient flag</text>
  <path class="a" d="M200 72 277 52"/><path class="a" d="M200 116 277 137"/><path class="a" d="M475 52 562 73"/><path class="a" d="M475 138 562 116"/><path class="a" d="M760 94 837 94"/>
</svg>
