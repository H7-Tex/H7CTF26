name: Rust in Peace
author: abu
category: rev
difficulty: medium
description: |
  A firmware vendor with strong opinions about memory safety shipped this licence validator. Give it
  the right 16-character licence and it reveals the token; get it wrong and it just shrugs.

  It won't disassemble as cleanly as you'd like, and it does a little arithmetic on your key before
  it decides. Figure out the key it accepts and read the token.
sub_description: |
  A stripped Linux binary. Recover the 16-character licence it accepts to reveal the token.
points: 300
flags:
  - type: static
    flag: "H7CTF{rust_b1n_r3v_f3rr1c_cr4ckm3}"
handout:
  - path: challenge/ferric.zip
tags: [rev, crackme]
