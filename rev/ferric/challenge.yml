name: Rust in Peace
author: abu
category: rev
difficulty: medium
description: |
  A firmware vendor with strong opinions about memory safety shipped this licence validator. Give it the right licence and it reveals the token; get it wrong and it just shrugs.

  Recover the licence it accepts and read the token.
