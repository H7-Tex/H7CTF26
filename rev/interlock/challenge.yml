name: Lockstep
author: abu
category: rev
difficulty: medium
description: |
  Lockstep is the key controller off a depot door — the kind where the pins aren't independent, they
  move together. Launch your instance, download your unit, feed it the right 16-character key and it
  opens.

  Brute force is hopeless, but the lock's own wiring gives the key away once you understand how the
  pins are tied to each other. Recover the key and read your flag.
sub_description: |
  Launch your instance and download your unique binary. Find the 16-character key it accepts.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/interlock
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, crackme]
