name: Lockstep
author: abu
category: rev
difficulty: medium
description: |
  Lockstep is the key controller off a depot door, the kind where the pins aren't independent but move together.

  Recover the key it accepts and read the flag.
sub_description: |
  Recover the key the controller accepts and read the flag.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/interlock
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, crackme]
