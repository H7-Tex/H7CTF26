name: Lockstep
author: abu
category: rev
difficulty: medium
description: |
  Lockstep is the key controller off a depot door: one exact sequence opens it, and everything else leaves you out in the yard. It is not the guessing kind of lock.

  These tumblers were never going to fall one at a time.
sub_description: |
  Recover the sequence the controller opens for and read the token.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/interlock
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, crackme]
