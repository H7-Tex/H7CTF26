name: Countersign
author: abu
category: rev
difficulty: insane
description: |
  Countersign is the attestation core of a licensed firmware module. Slide a pass under the glass and the clerk stamps whatever you hand him, but the core itself only ever walks a route it can vouch for, and a route it cannot vouch for quietly becomes a different route that looks like it worked.

  Reverse the core, learn to read its map, and make it print what it is guarding.
sub_description: |
  Connect over TCP and talk the line protocol printed on connect (GET, NONCE, MINT, RUN). Find the 24 byte input that drives the core to emit your flag.
points: 500
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: handout/countersign.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/countersign
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, vm, crypto-cfi]
