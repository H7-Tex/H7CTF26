name: Modem Operandi
author: abu
category: rev
difficulty: medium
description: |
  We pulled the licence checker out of a grey-market satellite modem's firmware. Type in a valid
  16-character licence key and it releases the carrier provisioning string — which is all we're after.

  It doesn't just compare your key against a stored value; there's machinery sitting between what you
  type and the verdict. Work out what it's doing, find the key it wants, and read the string.
sub_description: |
  A single Linux binary. Find the 16-character licence key it accepts and it hands you the flag.
points: 300
flags:
  - type: static
    flag: "H7CTF{cust0m_vm_l1c3ns3_w4rd3n_r3v}"
handout:
  - path: challenge/warden.zip
tags: [rev, crackme]
