name: Modem Operandi
author: abu
category: rev
difficulty: medium
description: |
  This licence checker was pulled from a grey-market satellite modem's firmware. Type a valid licence and it releases the carrier provisioning string.

  Work out the licence it wants and read the string.
sub_description: |
  A single Linux binary. Recover the licence it accepts and read the flag.
