name: Twenty Questions
author: abu
category: rev
difficulty: insane
description: |
  A hardware lab audits a sealer routine that swallows a device secret, stirs it, and shreds the leftovers. You do not get gdb. You get the Interrogator: it runs the bytecode you submit, and it counts every question you ask.

  Pull the secret back out, in as few questions as you can.
sub_description: |
  It shreds the secret, then hands you a debugger that bills per question. Fair.
points: 500
scoring: graded
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
handout:
  - path: handout/twenty-questions.zip
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/twenty-questions
  cpu_limit: "0.5"
  memory_limit: 256Mi
  exposed_ports:
    - { port: 1337, protocol: tcp }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, pwn, graded]
