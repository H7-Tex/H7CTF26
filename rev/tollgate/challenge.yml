name: Toll Story
author: abu
category: rev
difficulty: medium
description: |
  Toll Story is the admin lane of an internal API gateway. Show it the right token and the booth waves through the cluster bootstrap secret; show it anything else and you get "access denied."

  There's a toll on this road, and it isn't paid in cash.
sub_description: |
  Recover the token the booth accepts and read the secret.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/tollgate
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, crackme]
