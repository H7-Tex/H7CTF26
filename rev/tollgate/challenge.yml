name: Toll Story
author: abu
category: rev
difficulty: medium
description: |
  Toll Story is the admin-token booth from an internal API gateway. Give it the right token and it hands back the cluster bootstrap secret.

  Work out the token it accepts and read the secret.
sub_description: |
  Recover the token the booth accepts and read the secret.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/tollgate
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, crackme]
