name: Toll Story
author: abu
category: rev
difficulty: medium
description: |
  Toll Story is the admin-token booth from an internal API gateway. Launch your instance, download
  your unit, and give it the right token — it'll hand back the cluster bootstrap secret.

  The booth doesn't compare your token against a stored one; it runs your token through a turnstile of
  its own before deciding. Work out the token it accepts and read the secret.
sub_description: |
  Launch your instance and download your unique binary. Find the 16-character token it accepts.
points: 350
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/tollgate
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, crackme]
