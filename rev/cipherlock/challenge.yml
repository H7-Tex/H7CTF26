name: Constraint Yourself
author: abu
category: rev
difficulty: hard
description: |
  This lock won't open unless your 16-character key keeps a whole web of interlocking rules happy at
  once. Launch your instance, download your unit, and find the key that satisfies every one of them.

  Reading the rules out of the binary is the easy part; untangling them by hand is not. Recover the
  key and read your flag.
sub_description: |
  Launch your instance and download your unique binary. Find the 16-character key that satisfies it.
points: 400
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/cipherlock
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, crackme]
