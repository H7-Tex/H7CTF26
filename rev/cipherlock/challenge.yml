name: Constraint Yourself
author: abu
category: rev
difficulty: medium
description: |
  Cipherlock is the last lock in the vault, and it's a stubborn one: the key it wants has to satisfy it on every count or the door doesn't budge. Anything short of exactly right gets a flat "denied."

  Some locks you pick. This one you have to reason with.
sub_description: |
  Recover the key that opens the lock and read the flag.
points: 400
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/cipherlock
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, crackme]
