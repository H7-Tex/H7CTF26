name: Constraint Yourself
author: abu
category: rev
difficulty: medium
description: |
  This lock won't open unless your key keeps a whole web of interlocking rules satisfied at once.

  Recover the key and read the flag.
sub_description: |
  Recover the key that satisfies the lock and read the flag.
points: 400
flags:
  - type: dynamic
    dynamic_flag_prefix: "H7CTF{"
deploy:
  resource_type: docker
  instancing: on_demand
  image: h7ctf26/cipherlock
  cpu_limit: "1.0"
  memory_limit: 512Mi
  exposed_ports:
    - { port: 8080, protocol: http }
  instance_timeout: 3600
  max_extensions: 4
tags: [rev, crackme]
